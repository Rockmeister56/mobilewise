<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Existing Testimonial Module</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        
        .log {
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .log-item {
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .success { color: #4CAF50; }
        .error { color: #ff4444; }
        .info { color: #2196F3; }
        .warning { color: #FF9800; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Test Existing Testimonial Module</h1>
        <p>This tests your <strong>actual testimonial-player.js</strong> system directly</p>
        
        <div style="margin: 30px 0;">
            <button onclick="loadTestimonialModule()">1. Load Testimonial Module</button>
            <button onclick="triggerTestimonial()">2. Trigger Testimonial (showTestimonialSplashScreen)</button>
            <button onclick="triggerWithConcern('skeptical')">3. Trigger "Skeptical" Concern</button>
            <button onclick="triggerWithConcern('price')">4. Trigger "Price" Concern</button>
            <button onclick="triggerWithConcern('speed')">5. Trigger "Speed" Concern</button>
        </div>
        
        <h3>Console Log:</h3>
        <div id="consoleLog" class="log"></div>
    </div>

    <script>
        // Mock required global variables that your testimonial system expects
        window.speechSynthesis = {
            cancel: () => log('Mock: speechSynthesis.cancel()', 'info')
        };
        
        window.salesAI = { state: 'qualification' };
        window.conversationState = 'qualification';
        window.mobilewiseAI = { state: 'qualification' };
        
        // Mock chat container
        if (!document.getElementById('chatMessages')) {
            const chatDiv = document.createElement('div');
            chatDiv.id = 'chatMessages';
            chatDiv.className = 'chat-messages';
            chatDiv.style.cssText = 'position:fixed; bottom:100px; right:20px; width:400px; height:500px; background:rgba(0,0,0,0.5); z-index:999; overflow-y:auto;';
            document.body.appendChild(chatDiv);
        }
        
        // Logging function
        function log(message, type = 'info') {
            const logDiv = document.getElementById('consoleLog');
            const logItem = document.createElement('div');
            logItem.className = `log-item ${type}`;
            logItem.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(logItem);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        // 1. Load your actual testimonial module
        function loadTestimonialModule() {
            log('Loading testimonial-player.js...', 'info');
            
            const script = document.createElement('script');
            script.src = 'testimonial-player.js'; // Your actual file
            script.onload = function() {
                log('✅ testimonial-player.js loaded successfully!', 'success');
                log(`Available functions: ${Object.keys(window).filter(k => k.includes('testimonial') || k.includes('Testimonial')).join(', ')}`, 'info');
            };
            script.onerror = function() {
                log('❌ Failed to load testimonial-player.js', 'error');
            };
            document.head.appendChild(script);
        }
        
        // 2. Direct trigger - exactly what MobileWise AI calls
        function triggerTestimonial() {
            log('🎯 Calling showTestimonialSplashScreen()...', 'info');
            
            if (typeof window.showTestimonialSplashScreen === 'function') {
                window.showTestimonialSplashScreen();
                log('✅ showTestimonialSplashScreen() executed', 'success');
            } else {
                log('❌ showTestimonialSplashScreen() not found - Load module first', 'error');
            }
        }
        
        // 3. Trigger with concern data (simulating MobileWise AI concern detection)
        function triggerWithConcern(concernType) {
            log(`🎯 Triggering with "${concernType}" concern...`, 'info');
            
            // Set up mock testimonial data (your system expects this)
            window.testimonialData = {
                testimonialGroups: {
                    skeptical: {
                        title: "Skeptical Clients",
                        testimonials: [
                            {
                                title: "From Skeptic to Believer",
                                author: "John D.",
                                concernType: "skeptical",
                                videoUrl: "https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/videos/video_1764614248418.mp4"
                            }
                        ]
                    },
                    price: {
                        title: "Price Concerns",
                        testimonials: [
                            {
                                title: "Worth Every Penny",
                                author: "Sarah M.",
                                concernType: "price",
                                videoUrl: "https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/videos/video_1764614248418.mp4"
                            }
                        ]
                    },
                    speed: {
                        title: "Speed Results",
                        testimonials: [
                            {
                                title: "Fast Results Testimonial",
                                author: "Mike R.",
                                concernType: "speed",
                                videoUrl: "https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/videos/video_1764614248418.mp4"
                            }
                        ]
                    }
                }
            };
            
            log(`✅ Mock testimonial data set for "${concernType}"`, 'success');
            
            // Now trigger the testimonials
            setTimeout(() => {
                if (typeof window.showTestimonialSplashScreen === 'function') {
                    window.showTestimonialSplashScreen();
                    log(`✅ Testimonial splash shown for "${concernType}" concern`, 'success');
                } else {
                    log('❌ Function not available - load module first', 'error');
                }
            }, 100);
        }
        
        // Auto-load on page open
        window.addEventListener('DOMContentLoaded', function() {
            log('Page loaded. Click "Load Testimonial Module" to start.', 'info');
        });
    </script>
</body>
</html>
