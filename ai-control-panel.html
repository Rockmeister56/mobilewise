<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Control Panel - Powered by MobileWise AI</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- LemonSlice Widget -->
    <script type="module" src="https://unpkg.com/@lemonsliceai/lemon-slice-widget"></script>
    
    <!-- YOUR EXISTING TESTIMONIAL SYSTEM -->
    <script src="/js/testimonials-data.js"></script>
    <script src="/js/testimonial-player.js"></script> <!-- YOUR PLAYER -->
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --success: #4cc9f0;
            --dark: #1a1a2e;
            --darker: #16213e;
            --light: #f8f9fa;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --border: rgba(255,255,255,0.1);
            --shadow: 0 10px 30px rgba(0,0,0,0.2);
            --radius: 12px;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* ===== DASHBOARD LAYOUT ===== */
        .dashboard {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 100vw;
        }
        
        /* ===== HEADER ===== */
        header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .logo i {
            color: var(--success);
            font-size: 1.8rem;
        }
        
        .logo span {
            background: linear-gradient(90deg, var(--success), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .client-info {
            background: rgba(67, 97, 238, 0.15);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: 1px solid rgba(67, 97, 238, 0.3);
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .client-info i {
            margin-right: 8px;
            color: var(--success);
        }
        
        /* ===== MAIN CONTENT ===== */
        .content {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
            overflow: hidden;
        }
        
        /* ===== CHAT SECTION ===== */
        .chat-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .chat-section h2 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--success);
        }
        
        .chat-section h2 i {
            font-size: 1.3rem;
        }
        
        .widget-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            flex: 1;
            min-height: 600px;
            position: relative;
        }
        
        /* ===== CONTROL PANEL SECTION ===== */
        .control-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            min-width: 350px;
        }
        
        .control-section h2 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--success);
        }
        
        .control-section h2 i {
            font-size: 1.3rem;
        }
        
        /* ===== CONTROL BUTTONS ===== */
        .control-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .control-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            text-align: left;
        }
        
        .control-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(67, 97, 238, 0.3);
        }
        
        .control-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border);
        }
        
        .control-btn.secondary:hover {
            background: rgba(67, 97, 238, 0.2);
            border-color: var(--primary);
        }
        
        /* ===== TESTIMONIAL PREVIEW ===== */
        .testimonial-preview {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-top: 1rem;
        }
        
        .testimonial-preview h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .preview-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .preview-item:hover {
            background: rgba(67, 97, 238, 0.15);
            border-color: var(--primary);
        }
        
        .preview-item h4 {
            font-size: 0.95rem;
            margin-bottom: 5px;
            color: white;
        }
        
        .preview-item p {
            font-size: 0.8rem;
            color: var(--gray);
        }
        
        /* ===== FOOTER ===== */
        footer {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.active {
            background: #4CAF50;
        }
        
        .status-indicator.inactive {
            background: #f44336;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        /* ===== STATUS MESSAGES ===== */
        .status-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
            align-items: center;
            gap: 10px;
            max-width: 300px;
        }
        
        .status-message.show {
            display: flex;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .status-message.success { background: #4CAF50; }
        .status-message.error { background: #f44336; }
        .status-message.warning { background: #FF9800; }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 1200px) {
            .content {
                flex-direction: column;
            }
            
            .control-section {
                min-width: 100%;
            }
            
            .widget-container {
                min-height: 500px;
            }
        }
        
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            
            .content {
                padding: 1rem;
            }
            
            footer {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- DASHBOARD -->
    <div class="dashboard">
        <!-- HEADER -->
        <header>
            <div class="logo">
                <i class="fas fa-robot"></i>
                <span>MobileWise AI Control Panel</span>
            </div>
            <div class="client-info">
                <i class="fas fa-user-tie"></i>
                <span id="clientDisplay">Client: Loading...</span>
            </div>
        </header>
        
        <!-- MAIN CONTENT -->
        <div class="content">
            <!-- LEFT: LEMONSLICE CHAT -->
            <section class="chat-section">
                <h2><i class="fas fa-comments"></i> AI Conversation</h2>
                <div class="widget-container">
                    <!-- REPLACE THIS AGENT ID WITH YOUR ACTUAL LEMONSLICE AGENT ID -->
                    <lemon-slice-widget 
                        agent-id="YOUR_ACTUAL_LEMONSLICE_AGENT_ID_HERE"
                        controlled-widget-state="active"
                        style="width: 100%; height: 100%;"
                    ></lemon-slice-widget>
                </div>
                
                <!-- YOUR TESTIMONIAL SYSTEM WILL APPEAR HERE -->
                <div id="testimonialContainer"></div>
            </section>
            
            <!-- RIGHT: CONTROL PANEL -->
            <section class="control-section">
                <h2><i class="fas fa-sliders-h"></i> Control Panel</h2>
                
                <div class="control-buttons">
                    <button id="testimonialTrigger" class="control-btn">
                        <i class="fas fa-play-circle"></i> Trigger Testimonial System
                    </button>
                    <button id="toggleSpeech" class="control-btn secondary">
                        <i class="fas fa-microphone"></i> Toggle Speech Detection
                    </button>
                    <button id="sendWelcome" class="control-btn secondary">
                        <i class="fas fa-paper-plane"></i> Send Welcome Message
                    </button>
                    <button id="showTestimonialList" class="control-btn secondary">
                        <i class="fas fa-list"></i> Show Available Testimonials
                    </button>
                </div>
                
                <!-- Testimonial Preview -->
                <div class="testimonial-preview">
                    <h3><i class="fas fa-video"></i> Testimonial System Status</h3>
                    <div id="testimonialStatus">
                        <p>Your testimonial player system is ready.</p>
                        <p id="testimonialCount">Loading testimonial count...</p>
                    </div>
                </div>
                
                <!-- Available Testimonials List -->
                <div class="testimonial-preview" id="testimonialList" style="display: none;">
                    <h3><i class="fas fa-film"></i> Available Testimonials</h3>
                    <div id="testimonialItems">
                        <!-- Filled by JavaScript -->
                    </div>
                </div>
            </section>
        </div>
        
        <!-- FOOTER -->
        <footer>
            <div class="status">
                <span class="status-indicator active" id="systemStatus"></span>
                <span id="statusText">AI System Initializing...</span>
            </div>
            <div class="control-buttons" style="flex-direction: row; gap: 8px;">
                <button id="closeControlPanel" class="control-btn secondary" style="padding: 0.7rem 1rem;">
                    <i class="fas fa-times"></i> Close
                </button>
            </div>
        </footer>
    </div>
    
    <!-- STATUS MESSAGE -->
    <div id="statusMessage" class="status-message">
        <i class="fas fa-info-circle"></i>
        <span id="messageText">System ready</span>
    </div>

    <!-- ===== CORRECT INTEGRATION WITH YOUR SYSTEM ===== -->
    <script>
        // ==================== MAIN CONTROLLER ====================
        class AIControlPanel {
            constructor() {
                this.clientId = this.getClientId();
                this.widget = null;
                this.speechActive = true;
                this.testimonialSystemReady = false;
                this.init();
            }
            
            getClientId() {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get('client') || 'mortgage-assist-demo';
            }
            
            async init() {
                console.log('🚀 MobileWise AI Control Panel Initializing...');
                console.log('👤 Client:', this.clientId);
                
                // Update UI
                document.getElementById('clientDisplay').textContent = 
                    `Client: ${this.clientId.replace(/-/g, ' ').toUpperCase()}`;
                
                // Check if your testimonial system is loaded
                this.checkTestimonialSystem();
                
                // Initialize subsystems
                await this.initLemonSlice();
                this.initSpeechDetection();
                this.initEventListeners();
                this.initClientCommunication();
                
                // Update status
                this.updateStatus('AI Control Panel Ready', 'success');
                document.getElementById('statusText').textContent = 
                    'AI System Active | Speech Detection: ON';
                
                console.log('✅ MobileWise AI Control Panel Ready!');
            }
            
            // ==================== CHECK YOUR TESTIMONIAL SYSTEM ====================
            checkTestimonialSystem() {
                console.log('🔍 Checking for testimonial system...');
                
                if (window.testimonialData && window.showTestimonialSplashScreen) {
                    console.log('✅ Found YOUR testimonial system!');
                    this.testimonialSystemReady = true;
                    
                    // Update UI
                    const testimonialCount = this.getTestimonialCount();
                    document.getElementById('testimonialCount').textContent = 
                        `${testimonialCount} testimonials available`;
                    
                    this.updateStatus('Testimonial system loaded', 'success');
                } else {
                    console.warn('⚠️ Your testimonial system not found');
                    document.getElementById('testimonialCount').textContent = 
                        'Testimonial system not loaded';
                    this.updateStatus('Testimonial system missing', 'warning');
                }
            }
            
            getTestimonialCount() {
                if (!window.testimonialData) return 0;
                
                let count = 0;
                
                // Count from testimonial groups
                if (window.testimonialData.testimonialGroups) {
                    Object.values(window.testimonialData.testimonialGroups).forEach(group => {
                        if (group.testimonials) {
                            count += group.testimonials.length;
                        }
                    });
                }
                
                // Count from informational groups
                if (window.testimonialData.informationalGroups) {
                    Object.values(window.testimonialData.informationalGroups).forEach(group => {
                        if (group.videos) {
                            count += group.videos.length;
                        }
                    });
                }
                
                return count;
            }
            
            // ==================== TRIGGER YOUR TESTIMONIAL SYSTEM ====================
            triggerTestimonialSystem() {
                if (!this.testimonialSystemReady) {
                    this.updateStatus('Testimonial system not loaded', 'error');
                    return;
                }
                
                console.log('🎬 Triggering YOUR testimonial system...');
                
                // Clear any existing testimonials
                const container = document.getElementById('testimonialContainer');
                if (container) {
                    container.innerHTML = '';
                }
                
                // Call YOUR function from testimonial-player.js
                try {
                    window.showTestimonialSplashScreen();
                    this.updateStatus('Testimonial system activated', 'success');
                    
                    // Tell LemonSlice we're showing testimonials
                    this.sendToBot("I'm now showing you client testimonials. Click any button to watch!");
                    
                } catch (error) {
                    console.error('Failed to trigger testimonial system:', error);
                    this.updateStatus('Failed to trigger testimonials', 'error');
                }
            }
            
            showTestimonialList() {
                const listContainer = document.getElementById('testimonialList');
                const itemsContainer = document.getElementById('testimonialItems');
                
                if (listContainer.style.display === 'none') {
                    // Show list
                    listContainer.style.display = 'block';
                    
                    // Load testimonials
                    this.loadTestimonialList(itemsContainer);
                } else {
                    // Hide list
                    listContainer.style.display = 'none';
                }
            }
            
            loadTestimonialList(container) {
                if (!window.testimonialData) {
                    container.innerHTML = '<p>No testimonial data available</p>';
                    return;
                }
                
                container.innerHTML = '';
                let hasItems = false;
                
                // Add from testimonial groups
                if (window.testimonialData.testimonialGroups) {
                    Object.values(window.testimonialData.testimonialGroups).forEach(group => {
                        if (group.testimonials) {
                            group.testimonials.forEach(testimonial => {
                                this.addTestimonialItem(container, testimonial, group);
                                hasItems = true;
                            });
                        }
                    });
                }
                
                if (!hasItems) {
                    container.innerHTML = '<p>No testimonials found</p>';
                }
            }
            
            addTestimonialItem(container, testimonial, group) {
                const item = document.createElement('div');
                item.className = 'preview-item';
                item.innerHTML = `
                    <h4>${testimonial.title || 'Untitled'}</h4>
                    <p>${group.name || 'Testimonial'} • ${testimonial.author || 'Anonymous'}</p>
                `;
                
                item.addEventListener('click', () => {
                    // This would need to be connected to your player system
                    // For now, just show a message
                    this.updateStatus(`Selected: ${testimonial.title}`, 'info');
                });
                
                container.appendChild(item);
            }
            
            // ==================== LEMONSLICE INTEGRATION ====================
            async initLemonSlice() {
                console.log('🔗 Initializing LemonSlice...');
                
                // Wait for widget to load
                await this.waitForElement('lemon-slice-widget');
                this.widget = document.querySelector('lemon-slice-widget');
                
                // Set widget to active state
                this.widget.setAttribute('controlled-widget-state', 'active');
                
                // Listen for widget messages
                this.widget.addEventListener('message', (event) => {
                    const message = event.detail?.text;
                    if (message) {
                        console.log('🤖 LemonSlice Message:', message);
                        this.processBotMessage(message.toLowerCase());
                    }
                });
                
                console.log('✅ LemonSlice Connected');
                this.updateStatus('LemonSlice Connected', 'success');
            }
            
            waitForElement(selector) {
                return new Promise(resolve => {
                    const check = () => {
                        const element = document.querySelector(selector);
                        if (element && element.shadowRoot) {
                            resolve();
                        } else {
                            setTimeout(check, 100);
                        }
                    };
                    check();
                });
            }
            
            // ==================== SPEECH DETECTION ====================
            initSpeechDetection() {
                console.log('🎤 Initializing Speech Detection...');
                
                // Trigger phrases for YOUR testimonial system
                this.triggerPhrases = [
                    'show me testimonials',
                    'client testimonials',
                    'success stories',
                    'show me results',
                    'case studies',
                    'show me videos',
                    'client stories',
                    'show testimonials'
                ];
                
                // Start speech recognition if supported
                if ('webkitSpeechRecognition' in window) {
                    this.initWebSpeech();
                } else {
                    console.warn('Speech recognition not supported in this browser');
                    this.updateStatus('Speech recognition not supported', 'warning');
                }
            }
            
            initWebSpeech() {
                this.recognition = new webkitSpeechRecognition();
                this.recognition.continuous = true;
                this.recognition.interimResults = true;
                this.recognition.lang = 'en-US';
                
                this.recognition.onresult = (event) => {
                    let finalTranscript = '';
                    
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript.toLowerCase();
                        }
                    }
                    
                    if (finalTranscript) {
                        console.log('🎤 Speech detected:', finalTranscript);
                        this.checkForTriggers(finalTranscript);
                    }
                };
                
                this.recognition.onerror = (event) => {
                    console.log('Speech recognition error:', event.error);
                };
                
                this.recognition.onend = () => {
                    if (this.speechActive) {
                        setTimeout(() => this.recognition.start(), 500);
                    }
                };
                
                // Start listening
                this.recognition.start();
                console.log('✅ Speech detection active');
            }
            
            toggleSpeech() {
                this.speechActive = !this.speechActive;
                
                if (this.speechActive && this.recognition) {
                    this.recognition.start();
                    document.getElementById('statusText').textContent = 
                        'AI System Active | Speech Detection: ON';
                    this.updateStatus('Speech detection ON', 'success');
                } else if (this.recognition) {
                    this.recognition.stop();
                    document.getElementById('statusText').textContent = 
                        'AI System Active | Speech Detection: OFF';
                    this.updateStatus('Speech detection OFF', 'warning');
                }
            }
            
            // ==================== TRIGGER PROCESSING ====================
            processBotMessage(message) {
                this.checkForTriggers(message);
            }
            
            checkForTriggers(text) {
                for (const phrase of this.triggerPhrases) {
                    if (text.includes(phrase)) {
                        console.log(`🎯 TRIGGER DETECTED: "${phrase}"`);
                        this.triggerTestimonialSystem();
                        return true;
                    }
                }
                return false;
            }
            
            // ==================== CLIENT COMMUNICATION ====================
            initClientCommunication() {
                console.log('📡 Initializing client communication...');
                
                // Send ready signal to parent (client website)
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'CONTROL_PANEL_READY',
                        clientId: this.clientId,
                        testimonialSystemReady: this.testimonialSystemReady,
                        timestamp: Date.now()
                    }, '*');
                    console.log('📨 Sent READY signal to client');
                }
            }
            
            // ==================== BOT INTERACTION ====================
            async sendToBot(message) {
                if (this.widget) {
                    try {
                        await this.widget.sendMessage(message);
                        console.log('🤖 Sent to bot:', message);
                    } catch (error) {
                        console.error('Failed to send message to bot:', error);
                    }
                }
            }
            
            async sendWelcome() {
                const welcomeMessage = "Hi! I'm your AI assistant. You can ask me about testimonials, success stories, or how our system works. Just say 'show me testimonials' to see real client stories!";
                await this.sendToBot(welcomeMessage);
                this.updateStatus('Welcome message sent', 'success');
            }
            
            // ==================== UI UPDATES ====================
            updateStatus(message, type = 'info') {
                const statusElement = document.getElementById('statusMessage');
                const textElement = document.getElementById('messageText');
                
                // Update text
                textElement.textContent = message;
                
                // Update type
                statusElement.className = 'status-message ' + type;
                statusElement.classList.add('show');
                
                // Auto-hide
                setTimeout(() => {
                    statusElement.classList.remove('show');
                }, 3000);
                
                console.log(`📢 Status: ${message}`);
            }
            
            // ==================== EVENT LISTENERS ====================
            initEventListeners() {
                // Control buttons
                document.getElementById('testimonialTrigger').addEventListener('click', () => {
                    this.triggerTestimonialSystem();
                });
                
                document.getElementById('toggleSpeech').addEventListener('click', () => {
                    this.toggleSpeech();
                });
                
                document.getElementById('sendWelcome').addEventListener('click', () => {
                    this.sendWelcome();
                });
                
                document.getElementById('showTestimonialList').addEventListener('click', () => {
                    this.showTestimonialList();
                });
                
                document.getElementById('closeControlPanel').addEventListener('click', () => {
                    this.closeControlPanel();
                });
                
                // Listen for messages from client
                window.addEventListener('message', (event) => {
                    if (event.data.type === 'CONTROL_COMMAND') {
                        this.handleControlCommand(event.data);
                    }
                });
            }
            
            handleControlCommand(data) {
                console.log('Received control command:', data);
                
                switch(data.command) {
                    case 'trigger_testimonials':
                        this.triggerTestimonialSystem();
                        break;
                    case 'send_message':
                        this.sendToBot(data.message);
                        break;
                }
            }
            
            closeControlPanel() {
                // Notify parent to close this iframe
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'CLOSE_CONTROL_PANEL',
                        clientId: this.clientId
                    }, '*');
                }
                
                // If opened in new window
                if (window.opener) {
                    window.close();
                }
            }
        }
        
        // ==================== INITIALIZE ====================
        let controlPanel;
        
        document.addEventListener('DOMContentLoaded', () => {
            controlPanel = new AIControlPanel();
        });
        
        // Global functions for external access
        window.AIControlPanel = {
            triggerTestimonials: () => controlPanel.triggerTestimonialSystem(),
