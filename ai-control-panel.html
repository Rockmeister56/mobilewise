<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Control Panel - Powered by MobileWise AI</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- LemonSlice Widget -->
    <script type="module" src="https://unpkg.com/@lemonsliceai/lemon-slice-widget"></script>
    
    <!-- YOUR EXISTING TESTIMONIAL SYSTEM -->
    <script src="/js/testimonials-data.js"></script>
    <script src="/js/testimonial-player.js"></script> <!-- YOUR PLAYER -->
    
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #4361ee;
            --primary-dark: #3a56d4;
            --secondary: #7209b7;
            --success: #4cc9f0;
            --dark: #1a1a2e;
            --darker: #16213e;
            --light: #f8f9fa;
            --gray: #6c757d;
            --light-gray: #e9ecef;
            --border: rgba(255,255,255,0.1);
            --shadow: 0 10px 30px rgba(0,0,0,0.2);
            --radius: 12px;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: var(--light);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* ===== DASHBOARD LAYOUT ===== */
        .dashboard {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 100vw;
        }
        
        /* ===== HEADER ===== */
        header {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .logo i {
            color: var(--success);
            font-size: 1.8rem;
        }
        
        .logo span {
            background: linear-gradient(90deg, var(--success), var(--primary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .client-info {
            background: rgba(67, 97, 238, 0.15);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: 1px solid rgba(67, 97, 238, 0.3);
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .client-info i {
            margin-right: 8px;
            color: var(--success);
        }
        
        /* ===== MAIN CONTENT ===== */
        .content {
            display: flex;
            flex: 1;
            padding: 2rem;
            gap: 2rem;
            overflow: hidden;
        }
        
        /* ===== CHAT SECTION ===== */
        .chat-section {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .chat-section h2 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--success);
        }
        
        .chat-section h2 i {
            font-size: 1.3rem;
        }
        
        .widget-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            flex: 1;
            min-height: 600px;
            position: relative;
        }
        
        /* ===== CONTROL PANEL SECTION ===== */
        .control-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            min-width: 350px;
        }
        
        .control-section h2 {
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--success);
        }
        
        .control-section h2 i {
            font-size: 1.3rem;
        }
        
        /* ===== CONTROL BUTTONS ===== */
        .control-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .control-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 1.5rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            text-align: left;
        }
        
        .control-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(67, 97, 238, 0.3);
        }
        
        .control-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border);
        }
        
        .control-btn.secondary:hover {
            background: rgba(67, 97, 238, 0.2);
            border-color: var(--primary);
        }
        
        .control-btn.module-btn {
            background: rgba(76, 201, 240, 0.2);
            border-left: 4px solid var(--success);
        }
        
        .control-btn.module-btn:hover {
            background: rgba(76, 201, 240, 0.3);
        }
        
        /* ===== TESTIMONIAL PREVIEW ===== */
        .testimonial-preview {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-top: 1rem;
        }
        
        .testimonial-preview h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--success);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .preview-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .preview-item:hover {
            background: rgba(67, 97, 238, 0.15);
            border-color: var(--primary);
        }
        
        .preview-item h4 {
            font-size: 0.95rem;
            margin-bottom: 5px;
            color: white;
        }
        
        .preview-item p {
            font-size: 0.8rem;
            color: var(--gray);
        }
        
        .module-tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-left: 8px;
            background: var(--secondary);
            color: white;
        }
        
        .module-tag.results { background: #f72585; }
        .module-tag.success { background: #4cc9f0; }
        .module-tag.calculator { background: #7209b7; }
        
        /* ===== FOOTER ===== */
        footer {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        
        .status-indicator.active {
            background: #4CAF50;
        }
        
        .status-indicator.inactive {
            background: #f44336;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        /* ===== STATUS MESSAGES ===== */
        .status-message {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none;
            align-items: center;
            gap: 10px;
            max-width: 300px;
        }
        
        .status-message.show {
            display: flex;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .status-message.success { background: #4CAF50; }
        .status-message.error { background: #f44336; }
        .status-message.warning { background: #FF9800; }
        .status-message.info { background: #4361ee; }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 1200px) {
            .content {
                flex-direction: column;
            }
            
            .control-section {
                min-width: 100%;
            }
            
            .widget-container {
                min-height: 500px;
            }
        }
        
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            
            .content {
                padding: 1rem;
            }
            
            footer {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- DASHBOARD -->
    <div class="dashboard">
        <!-- HEADER -->
        <header>
            <div class="logo">
                <i class="fas fa-robot"></i>
                <span>MobileWise AI Control Panel</span>
            </div>
            <div class="client-info">
                <i class="fas fa-user-tie"></i>
                <span id="clientDisplay">Client: Loading...</span>
            </div>
        </header>
        
        <!-- MAIN CONTENT -->
        <div class="content">
            <!-- LEFT: LEMONSLICE CHAT -->
            <section class="chat-section">
                <h2><i class="fas fa-comments"></i> AI Conversation</h2>
                <div class="widget-container">
                    <!-- REPLACE THIS AGENT ID WITH YOUR ACTUAL LEMONSLICE AGENT ID -->
                    <lemon-slice-widget 
                        agent-id="agent_1db77d60ec132469" 
                        controlled-widget-state="active"
                        style="width: 100%; height: 100%;"

            <section class="control-section">

    <!-- STATUS MESSAGE -->
    <div id="statusMessage" class="status-message">
        <i class="fas fa-info-circle"></i>
        <span id="messageText">System ready</span>
    </div>

    <!-- ===== CORRECT INTEGRATION WITH YOUR SYSTEM ===== -->
    <script>
    // ==================== MAIN CONTROLLER ====================
    class AIControlPanel {
        constructor() {
            this.clientId = this.getClientId();
            this.widget = null;
            this.speechActive = true;
            this.testimonialSystemReady = false;
            
            // NO hardcoded URLs - we'll get them from your testimonial system
            this.availableTestimonials = [];
            this.modules = {
                results: {
                    name: 'Results Gallery',
                    description: 'Client results and metrics',
                    group: 'results' // This should match a group in your testimonialData
                },
                success: {
                    name: 'Success Stories', 
                    description: 'Real client success stories',
                    group: 'success'
                },
                calculator: {
                    name: 'ROI Calculator',
                    description: 'Calculate your potential ROI',
                    // This might be a special module, not necessarily a testimonial
                },
                testimonial: {
                    name: 'Testimonial Gallery',
                    description: 'Client video testimonials'
                }
            };
            
            this.init();
        }
        
        getClientId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('client') || 'mortgage-assist-demo';
        }
        
        async init() {
            console.log('🚀 MobileWise AI Control Panel Initializing...');
            console.log('👤 Client:', this.clientId);
            
            // Update UI
            document.getElementById('clientDisplay').textContent = 
                `Client: ${this.clientId.replace(/-/g, ' ').toUpperCase()}`;
            
            // Check if your testimonial system is loaded
            this.checkTestimonialSystem();
            
            // Initialize subsystems
            await this.initLemonSlice();
            this.initSpeechDetection();
            this.initEventListeners();
            this.initClientCommunication();
            
            // Update status
            this.updateStatus('AI Control Panel Ready', 'success');
            document.getElementById('statusText').textContent = 
                'AI System Active | Speech Detection: ON';
            
            console.log('✅ MobileWise AI Control Panel Ready!');
        }
        
        // ==================== CHECK YOUR TESTIMONIAL SYSTEM ====================
        checkTestimonialSystem() {
            console.log('🔍 Checking for testimonial system...');
            
            if (window.testimonialData && window.showTestimonialSplashScreen) {
                console.log('✅ Found YOUR testimonial system!');
                this.testimonialSystemReady = true;
                
                // Load available testimonials
                this.loadAvailableTestimonials();
                
                // Update UI
                const testimonialCount = this.getTestimonialCount();
                document.getElementById('testimonialStatusText').textContent = 
                    `${testimonialCount} testimonials available`;
                
                this.updateStatus('Testimonial system loaded', 'success');
            } else {
                console.warn('⚠️ Your testimonial system not found');
                document.getElementById('testimonialStatusText').textContent = 
                    'Testimonial system not loaded';
                this.updateStatus('Testimonial system missing', 'warning');
            }
        }
        
        loadAvailableTestimonials() {
            if (!window.testimonialData) return;
            
            this.availableTestimonials = [];
            
            // Collect testimonials from all groups
            if (window.testimonialData.testimonialGroups) {
                Object.entries(window.testimonialData.testimonialGroups).forEach(([groupName, group]) => {
                    if (group.testimonials) {
                        group.testimonials.forEach(testimonial => {
                            this.availableTestimonials.push({
                                ...testimonial,
                                group: groupName,
                                groupName: group.name,
                                type: 'testimonial'
                            });
                        });
                    }
                });
            }
            
            // Collect from informational groups
            if (window.testimonialData.informationalGroups) {
                Object.entries(window.testimonialData.informationalGroups).forEach(([groupName, group]) => {
                    if (group.videos) {
                        group.videos.forEach(video => {
                            this.availableTestimonials.push({
                                ...video,
                                group: groupName,
                                groupName: group.name,
                                type: 'informational'
                            });
                        });
                    }
                });
            }
            
            console.log('📊 Available testimonials:', this.availableTestimonials.length);
        }
        
        getTestimonialCount() {
            return this.availableTestimonials.length || 0;
        }
        
        // ==================== MODULE TRIGGERS ====================
        triggerModule(moduleName) {
            console.log(`🎬 Triggering module: ${moduleName}`);
            
            const moduleInfo = this.modules[moduleName];
            
            if (!moduleInfo) {
                console.error(`Module ${moduleName} not found`);
                return;
            }
            
            // If it's the testimonial module, trigger your testimonial system
            if (moduleName === 'testimonial') {
                this.triggerTestimonialSystem();
                return;
            }
            
            // For other modules, find a relevant testimonial
            const testimonial = this.findTestimonialForModule(moduleName);
            
            if (testimonial) {
                // Send message to parent widget with actual testimonial data
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'MODULE_TRIGGERED',
                        module: moduleName,
                        videoUrl: testimonial.videoUrl || testimonial.url,
                        moduleName: moduleInfo.name,
                        clientId: this.clientId,
                        testimonialTitle: testimonial.title,
                        timestamp: Date.now()
                    }, '*');
                    
                    console.log('📨 Sent MODULE_TRIGGERED to parent:', testimonial.title);
                    
                    // Update status
                    this.updateStatus(`Triggered: ${testimonial.title}`, 'success');
                    
                    // Notify the bot
                    this.sendToBot(`I've found a ${moduleInfo.name} video for you: "${testimonial.title}"`);
                }
            } else {
                // No specific testimonial found for this module
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'MODULE_TRIGGERED',
                        module: moduleName,
                        videoUrl: this.getDefaultVideoForModule(moduleName),
                        moduleName: moduleInfo.name,
                        clientId: this.clientId,
                        timestamp: Date.now()
                    }, '*');
                    
                    console.log('📨 Sent generic MODULE_TRIGGERED to parent');
                    
                    this.updateStatus(`Triggered: ${moduleInfo.name}`, 'success');
                    this.sendToBot(`I'm showing you ${moduleInfo.name}`);
                }
            }
        }
        
        findTestimonialForModule(moduleName) {
            // Try to find a testimonial that matches the module
            const moduleKeywords = {
                results: ['results', 'metrics', 'performance', 'numbers', 'data'],
                success: ['success', 'story', 'case study', 'client', 'testimonial'],
                calculator: ['calculator', 'roi', 'calculate', 'return']
            };
            
            const keywords = moduleKeywords[moduleName] || [];
            
            for (const testimonial of this.availableTestimonials) {
                const searchText = (testimonial.title + ' ' + testimonial.description + ' ' + testimonial.groupName).toLowerCase();
                
                for (const keyword of keywords) {
                    if (searchText.includes(keyword)) {
                        return testimonial;
                    }
                }
            }
            
            // Return first testimonial as fallback
            return this.availableTestimonials[0];
        }
        
        getDefaultVideoForModule(moduleName) {
            // This should point to a generic/default video for each module
            // You can update these to point to actual default videos
            const defaults = {
                results: '/videos/default-results.mp4',
                success: '/videos/default-success.mp4',
                calculator: '/videos/default-calculator.mp4',
                testimonial: '/videos/default-testimonial.mp4'
            };
            
            return defaults[moduleName] || '/videos/default.mp4';
        }
        
        // ==================== TRIGGER YOUR TESTIMONIAL SYSTEM ====================
        triggerTestimonialSystem() {
            if (!this.testimonialSystemReady) {
                this.updateStatus('Testimonial system not loaded', 'error');
                return;
            }
            
            console.log('🎬 Triggering YOUR testimonial system...');
            
            // Clear any existing testimonials
            const container = document.getElementById('testimonialContainer');
            if (container) {
                container.innerHTML = '';
            }
            
            // Call YOUR function from testimonial-player.js
            try {
                window.showTestimonialSplashScreen();
                this.updateStatus('Testimonial system activated', 'success');
                
                // Get a random testimonial to send to parent
                const randomTestimonial = this.getRandomTestimonial();
                
                // Notify parent
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'TESTIMONIAL_TRIGGERED',
                        clientId: this.clientId,
                        videoUrl: randomTestimonial?.videoUrl || randomTestimonial?.url,
                        testimonial: randomTestimonial,
                        timestamp: Date.now()
                    }, '*');
                }
                
                // Tell LemonSlice we're showing testimonials
                this.sendToBot("I'm now showing you client testimonials. Click any button to watch!");
                
            } catch (error) {
                console.error('Failed to trigger testimonial system:', error);
                this.updateStatus('Failed to trigger testimonials', 'error');
            }
        }
        
        getRandomTestimonial() {
            if (this.availableTestimonials.length === 0) return null;
            const randomIndex = Math.floor(Math.random() * this.availableTestimonials.length);
            return this.availableTestimonials[randomIndex];
        }
        
        showTestimonialList() {
            const listContainer = document.getElementById('testimonialList');
            const itemsContainer = document.getElementById('testimonialItems');
            
            if (listContainer.style.display === 'none') {
                // Show list
                listContainer.style.display = 'block';
                
                // Load content list
                this.loadContentList(itemsContainer);
            } else {
                // Hide list
                listContainer.style.display = 'none';
            }
        }
        
        loadContentList(container) {
            container.innerHTML = '';
            
            if (this.availableTestimonials.length === 0) {
                container.innerHTML = '<p>No content available</p>';
                return;
            }
            
            // Show actual testimonials from your system
            this.availableTestimonials.slice(0, 10).forEach(testimonial => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                
                // Determine module tag based on content
                const moduleTag = this.getModuleTagForTestimonial(testimonial);
                
                div.innerHTML = `
                    <h4>${testimonial.title || 'Untitled'}</h4>
                    <p>${testimonial.groupName || 'Content'} • ${testimonial.author || 'Client'}</p>
                    ${moduleTag ? `<span class="module-tag ${moduleTag}">${moduleTag.toUpperCase()}</span>` : ''}
                `;
                
                div.addEventListener('click', () => {
                    // Determine which module to trigger
                    const module = this.getModuleForTestimonial(testimonial);
                    this.triggerModule(module);
                    
                    this.updateStatus(`Starting: ${testimonial.title}`, 'info');
                });
                
                container.appendChild(div);
            });
        }
        
        getModuleTagForTestimonial(testimonial) {
            const text = (testimonial.title + ' ' + testimonial.description).toLowerCase();
            
            if (text.includes('result') || text.includes('metric') || text.includes('data')) {
                return 'results';
            } else if (text.includes('success') || text.includes('story') || text.includes('case')) {
                return 'success';
            } else if (text.includes('calculator') || text.includes('roi') || text.includes('calculate')) {
                return 'calculator';
            }
            
            return null;
        }
        
        getModuleForTestimonial(testimonial) {
            const tag = this.getModuleTagForTestimonial(testimonial);
            return tag || 'testimonial';
        }
            
            // ==================== LEMONSLICE INTEGRATION ====================
            async initLemonSlice() {
                console.log('🔗 Initializing LemonSlice...');
                
                // Wait for widget to load
                await this.waitForElement('lemon-slice-widget');
                this.widget = document.querySelector('lemon-slice-widget');
                
                // Set widget to active state
                this.widget.setAttribute('controlled-widget-state', 'active');
                
                // Listen for widget messages
                this.widget.addEventListener('message', (event) => {
                    const message = event.detail?.text;
                    if (message) {
                        console.log('🤖 LemonSlice Message:', message);
                        this.processBotMessage(message.toLowerCase());
                    }
                });
                
                console.log('✅ LemonSlice Connected');
                this.updateStatus('LemonSlice Connected', 'success');
            }
            
            waitForElement(selector) {
                return new Promise(resolve => {
                    const check = () => {
                        const element = document.querySelector(selector);
                        if (element && element.shadowRoot) {
                            resolve();
                        } else {
                            setTimeout(check, 100);
                        }
                    };
                    check();
                });
            }
            
            // ==================== SPEECH DETECTION ====================
            initSpeechDetection() {
                console.log('🎤 Initializing Speech Detection...');
                
                // Trigger phrases for modules
                this.triggerPhrases = {
                    'results': ['show results', 'results gallery', 'metrics', 'performance'],
                    'success': ['success stories', 'successful clients', 'stories', 'case studies'],
                    'calculator': ['calculator', 'roi', 'calculate', 'return on investment'],
                    'testimonial': ['testimonials', 'client stories', 'reviews', 'feedback']
                };
                
                // Start speech recognition if supported
                if ('webkitSpeechRecognition' in window) {
                    this.initWebSpeech();
                } else {
                    console.warn('Speech recognition not supported in this browser');
                    this.updateStatus('Speech recognition not supported', 'warning');
                }
            }
            
            initWebSpeech() {
                this.recognition = new webkitSpeechRecognition();
                this.recognition.continuous = true;
                this.recognition.interimResults = true;
                this.recognition.lang = 'en-US';
                
                this.recognition.onresult = (event) => {
                    let finalTranscript = '';
                    
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript.toLowerCase();
                        }
                    }
                    
                    if (finalTranscript) {
                        console.log('🎤 Speech detected:', finalTranscript);
                        this.checkForTriggers(finalTranscript);
                    }
                };
                
                this.recognition.onerror = (event) => {
                    console.log('Speech recognition error:', event.error);
                };
                
                this.recognition.onend = () => {
                    if (this.speechActive) {
                        setTimeout(() => this.recognition.start(), 500);
                    }
                };
                
                // Start listening
                this.recognition.start();
                console.log('✅ Speech detection active');
            }
            
            toggleSpeech() {
                this.speechActive = !this.speechActive;
                
                if (this.speechActive && this.recognition) {
                    this.recognition.start();
                    document.getElementById('speechStatus').textContent = 'ON';
                    document.getElementById('statusText').textContent = 
                        'AI System Active | Speech Detection: ON';
                    this.updateStatus('Speech detection ON', 'success');
                } else if (this.recognition) {
                    this.recognition.stop();
                    document.getElementById('speechStatus').textContent = 'OFF';
                    document.getElementById('statusText').textContent = 
                        'AI System Active | Speech Detection: OFF';
                    this.updateStatus('Speech detection OFF', 'warning');
                }
            }
            
            // ==================== TRIGGER PROCESSING ====================
            processBotMessage(message) {
                this.checkForTriggers(message);
            }
            
            checkForTriggers(text) {
                for (const [module, phrases] of Object.entries(this.triggerPhrases)) {
                    for (const phrase of phrases) {
                        if (text.includes(phrase)) {
                            console.log(`🎯 TRIGGER DETECTED: "${phrase}" -> ${module}`);
                            this.triggerModule(module);
                            return true;
                        }
                    }
                }
                return false;
            }
            
            // ==================== CLIENT COMMUNICATION ====================
            initClientCommunication() {
                console.log('📡 Initializing client communication...');
                
                // Send ready signal to parent (client website)
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'CONTROL_PANEL_READY',
                        clientId: this.clientId,
                        testimonialSystemReady: this.testimonialSystemReady,
                        timestamp: Date.now()
                    }, '*');
                    console.log('📨 Sent READY signal to client');
                }
            }
            
            // ==================== BOT INTERACTION ====================
            async sendToBot(message) {
                if (this.widget) {
                    try {
                        await this.widget.sendMessage(message);
                        console.log('🤖 Sent to bot:', message);
                    } catch (error) {
                        console.error('Failed to send message to bot:', error);
                    }
                }
            }
            
            async sendWelcome() {
                const welcomeMessage = "Hi! I'm your AI assistant. You can ask me about testimonials, success stories, ROI calculations, or how our system works. Try saying 'show me success stories' or 'calculate ROI'!";
                await this.sendToBot(welcomeMessage);
                this.updateStatus('Welcome message sent', 'success');
            }
            
            // ==================== UI UPDATES ====================
            updateStatus(message, type = 'info') {
                const statusElement = document.getElementById('statusMessage');
                const textElement = document.getElementById('messageText');
                
                // Update text
                textElement.textContent = message;
                
                // Update type
                statusElement.className = 'status-message ' + type;
                statusElement.classList.add('show');
                
                // Auto-hide
                setTimeout(() => {
                    statusElement.classList.remove('show');
                }, 3000);
                
                console.log(`📢 Status: ${message}`);
            }
            
            // ==================== EVENT LISTENERS ====================
            initEventListeners() {
                // Module buttons
                document.getElementById('triggerResults').addEventListener('click', () => {
                    this.triggerModule('results');
                });
                
                document.getElementById('triggerSuccess').addEventListener('click', () => {
                    this.triggerModule('success');
                });
                
                document.getElementById('triggerCalculator').addEventListener('click', () => {
                    this.triggerModule('calculator');
                });
                
                // Control buttons
                document.getElementById('testimonialTrigger').addEventListener('click', () => {
                    this.triggerModule('testimonial');
                });
                
                document.getElementById('toggleSpeech').addEventListener('click', () => {
                    this.toggleSpeech();
                });
                
                document.getElementById('sendWelcome').addEventListener('click', () => {
                    this.sendWelcome();
                });
                
                document.getElementById('showTestimonialList').addEventListener('click', () => {
                    this.showTestimonialList();
                });
                
                document.getElementById('closeControlPanel').addEventListener('click', () => {
                    this.closeControlPanel();
                });
                
                // Listen for messages from client
                window.addEventListener('message', (event) => {
                    if (event.data.type === 'TRIGGER_MODULE') {
                        this.triggerModule(event.data.module);
                    } else if (event.data.type === 'CONTROL_COMMAND') {
                        this.handleControlCommand(event.data);
                    }
                });
            }
            
            handleControlCommand(data) {
                console.log('Received control command:', data);
                
                switch(data.command) {
                    case 'trigger_testimonials':
                        this.triggerModule('testimonial');
                        break;
                    case 'trigger_results':
                        this.triggerModule('results');
                        break;
                    case 'send_message':
                        this.sendToBot(data.message);
                        break;
                }
            }
            
            closeControlPanel() {
                // Notify parent to close this iframe
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'CLOSE_CONTROL_PANEL',
                        clientId: this.clientId
                    }, '*');
                }
                
                // If opened in new window
                if (window.opener) {
                    window.close();
                }
            }
        }
        
        // ==================== INITIALIZE ====================
        let controlPanel;
        
        document.addEventListener('DOMContentLoaded', () => {
            controlPanel = new AIControlPanel();
        });
        
        // Global functions for external access
        window.AIControlPanel = {
            triggerResults: () => controlPanel.triggerModule('results'),
            triggerSuccess: () => controlPanel.triggerModule('success'),
            triggerCalculator: () => controlPanel.triggerModule('calculator'),
            triggerTestimonials: () => controlPanel.triggerTestimonialSystem(),
            sendMessage: (message) => controlPanel.sendToBot(message),
            updateStatus: (message, type) => controlPanel.updateStatus(message, type)
        };
    </script>
</body>
</html>
