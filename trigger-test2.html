<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 TRIGGER TEST: Botemia → Player</title>
    <style>
        body {
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        
        /* 3 BUTTONS - SUPER SIMPLE */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .trigger-btn {
            background: #0066ff;
            color: white;
            border: none;
            padding: 20px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            min-width: 180px;
        }
        
        .trigger-btn:hover {
            background: #0055dd;
            transform: translateY(-2px);
        }
        
        /* PLAYER AREA - WHERE TESTIMONIALS APPEAR */
        #playerArea {
            background: #1a1a1a;
            border: 3px solid #333;
            border-radius: 15px;
            min-height: 500px;
            margin-bottom: 30px;
            padding: 20px;
            overflow: auto;
        }
        
        .placeholder {
            text-align: center;
            padding: 100px 20px;
            color: #666;
        }
        
        /* STATUS - SIMPLE LOG */
        .status {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        
        .log {
            background: #111;
            border-radius: 5px;
            padding: 15px;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            color: #0af;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 BOTEMIA TRIGGER TEST</h1>
        <p class="subtitle">Click button → Testimonial player appears below</p>
        
        <!-- 3 BUTTONS -->
        <div class="buttons">
            <button class="trigger-btn" onclick="triggerTestimonial(1)">Trigger 1</button>
            <button class="trigger-btn" onclick="triggerTestimonial(2)">Trigger 2</button>
            <button class="trigger-btn" onclick="triggerTestimonial(3)">Trigger 3</button>
        </div>
        
        <!-- PLAYER AREA -->
        <div id="playerArea">
            <div class="placeholder" id="placeholder">
                <h3>🎬 TESTIMONIAL PLAYER AREA</h3>
                <p>Click any trigger button above</p>
                <p style="color: #00ff88; margin-top: 20px;">Player will load here...</p>
            </div>
        </div>
        
        <!-- STATUS LOG -->
        <div class="status">
            <h3 style="color: #0af; margin-top: 0;">System Log:</h3>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script>
        // ====================
        // SIMPLE LOGGING
        // ====================
        function log(message) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        // ====================
        // LOAD TESTIMONIAL MODULE
        // ====================
        function loadTestimonialModule(callback) {
            // Check if already loaded
            if (window.testimonialModuleLoaded) {
                log('✅ Testimonial module already loaded');
                callback();
                return;
            }
            
            log('📦 Loading testimonial-player.js...');
            
            const script = document.createElement('script');
            script.src = 'testimonial-player.js';
            
            script.onload = function() {
                window.testimonialModuleLoaded = true;
                log('✅ testimonial-player.js loaded successfully!');
                callback();
            };
            
            script.onerror = function() {
                log('❌ ERROR: Cannot load testimonial-player.js');
                log('📁 Make sure it is in the same folder as this HTML file');
                alert('ERROR: Cannot load testimonial-player.js\nMake sure it is in the same folder!');
            };
            
            document.head.appendChild(script);
        }

        // ====================
        // TRIGGER TESTIMONIAL
        // ====================
        function triggerTestimonial(number) {
            log(`🎯 TRIGGER ${number} clicked`);
            
            // Clear previous player
            document.getElementById('playerArea').innerHTML = '';
            
            // Show loading
            const loadingDiv = document.createElement('div');
            loadingDiv.innerHTML = `
                <div style="text-align: center; padding: 50px; color: #0af;">
                    <h3>🚀 Loading Testimonial Player...</h3>
                    <p>Trigger ${number} activated</p>
                </div>
            `;
            document.getElementById('playerArea').appendChild(loadingDiv);
            
            // Load module then show player
            loadTestimonialModule(function() {
                showTestimonialPlayer();
            });
        }

        // ====================
        // SHOW TESTIMONIAL PLAYER
        // ====================
        function showTestimonialPlayer() {
            log('🎬 Calling showTestimonialSplashScreen()...');
            
            // IMPORTANT: Create a chat container for the testimonial
            const playerArea = document.getElementById('playerArea');
            
            // First, clear everything
            playerArea.innerHTML = '';
            
            // Create the EXACT container that testimonial-player.js expects
            const chatContainer = document.createElement('div');
            chatContainer.id = 'chatMessages';
            chatContainer.className = 'chat-messages';
            chatContainer.style.cssText = 'width: 100%; min-height: 100%;';
            
            playerArea.appendChild(chatContainer);
            
            log('✅ Created #chatMessages container for testimonial');
            
            // Wait a moment, then call the function
            setTimeout(function() {
                try {
                    // Call the function
                    window.showTestimonialSplashScreen();
                    log('✅ showTestimonialSplashScreen() called successfully!');
                    
                    // Check if anything appeared
                    setTimeout(function() {
                        if (chatContainer.children.length > 0) {
                            log('🎉 SUCCESS: Testimonial player is now visible!');
                        } else {
                            log('⚠️ Function called but no content appeared');
                            log('Checking if showTestimonialSplashScreen exists...');
                            
                            if (typeof window.showTestimonialSplashScreen === 'function') {
                                log('✅ Function exists');
                                // Try one more time
                                window.showTestimonialSplashScreen();
                            }
                        }
                    }, 500);
                    
                } catch (error) {
                    log(`❌ ERROR calling function: ${error.message}`);
                }
            }, 100);
        }

        // ====================
        // INITIALIZE
        // ====================
        window.onload = function() {
            log('✅ Test system ready');
            log('Click any trigger button to start');
            
            // Check if testimonial-player.js exists
            fetch('testimonial-player.js')
                .then(response => {
                    if (response.ok) {
                        log('✅ Found testimonial-player.js in folder');
                    } else {
                        log('⚠️ Warning: testimonial-player.js not found in folder');
                    }
                })
                .catch(() => {
                    log('⚠️ Warning: testimonial-player.js not found in folder');
                });
        };
    </script>
</body>
</html>
