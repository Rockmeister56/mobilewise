        // ========== LOGGING ==========
        function log(msg, type = 'info') {
            const el = document.createElement('div');
            el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (type === 'success') el.className = 'success';
            if (type === 'error') el.className = 'error';
            if (type === 'trigger') el.className = 'trigger';
            document.getElementById('log').appendChild(el);
            console.log(msg);

        // ========== IMMEDIATE LISTENER FOR INTRO ==========
function initializeSystemForIntro() {
    log('🚨 CRITICAL CHANGE: Listening for Botinia\'s INTRO speech...', 'info');
    document.getElementById('status').textContent = 'Listening for Botinia\'s intro...';
    
    // Don't wait for user - start immediately
    const widget = document.querySelector('lemon-slice-widget');
    if (!widget?.shadowRoot) {
        log('Widget not loaded yet. Retrying in 1 second...', 'warning');
        setTimeout(initializeSystemForIntro, 1000);
        return;
    }
    
    // Capture ALL audio elements immediately
    const audioElements = widget.shadowRoot.querySelectorAll('audio');
    log(`Found ${audioElements.length} audio elements. Listening for ANY playback...`, 'info');
    
    let hasCaptured = false;
    
    audioElements.forEach((audio, index) => {
        // Listen for ANY playback (including intro)
        audio.addEventListener('play', function() {
            if (hasCaptured) return;
            hasCaptured = true;
            
            log(`🎉 Botinia is SPEAKING (Intro/Audio #${index})!`, 'success');
            
            // Hook into audio stream
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaElementSource(audio);
                source.connect(audioContext.destination);
                
                log('✅ Audio stream CAPTURED! Now transcribing everything...', 'success');
                document.getElementById('status').textContent = 'Transcribing Botinia...';
                
                // Start speech recognition IMMEDIATELY
                startSpeechRecognition();
                
                // Also listen for the END of her intro
                audio.addEventListener('ended', function() {
                    log('Botinia finished speaking. Ready for conversation.', 'info');
                });
                
            } catch (error) {
                log(`Audio capture error: ${error.message}`, 'error');
            }
        });
        
        // Also watch for src changes (stream assignment)
        if (!audio.src && !audio.currentSrc) {
            const observer = new MutationObserver(() => {
                if (audio.src || audio.currentSrc) {
                    log(`Audio #${index} got stream assigned`, 'info');
                }
            });
            observer.observe(audio, { attributes: true, attributeFilter: ['src', 'currentSrc'] });
        }
    });
    
    log('System READY to capture Botinia\'s intro. She will speak any moment...', 'success');
}

        // ========== SPEECH RECOGNITION ==========
        function startSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window)) {
                log('ERROR: Web Speech API not supported in this browser.', 'error');
                return;
            }
            
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 3;
            
            recognition.onstart = function() {
                log('Speech recognition ACTIVE. Listening to Botinia...', 'success');
            };
            
            recognition.onresult = function(event) {
                let fullTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    fullTranscript += transcript + ' ';
                }
                
                const cleanTranscript = fullTranscript.toLowerCase().trim();
                log(`Botinia said: "${cleanTranscript.substring(0, 80)}${cleanTranscript.length > 80 ? '...' : ''}"`);
                
                // CHECK FOR TRIGGER PHRASE
                if (cleanTranscript.includes(TRIGGER_PHRASE)) {
                    log(`🎉🎉🎉 TRIGGER PHRASE DETECTED!`, 'trigger');
                    log(`Launching testimonial player...`, 'trigger');
                    document.getElementById('status').textContent = 'TRIGGERED! Launching testimonials...';
                    
                    // Stop listening
                    recognition.stop();
                    
                    // LAUNCH YOUR TESTIMONIAL PLAYER HERE
                    launchTestimonialPlayer();
                }
            };
            
            recognition.onerror = function(event) {
                log(`Recognition error: ${event.error}`, 'error');
            };
            
            recognition.onend = function() {
                log('Speech recognition ended.', 'info');
            };
            
            // Start recognition
            try {
                recognition.start();
            } catch (e) {
                log(`Cannot start recognition: ${e.message}`, 'error');
            }
        }
