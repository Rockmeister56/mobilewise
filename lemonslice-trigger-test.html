        .success { color: #27ae60; font-weight: bold; }
        .error { color: #e74c3c; }
        .trigger { color: #f39c12; font-weight: bold; }

<body>
    <h1>🎤 LemonSlice Audio Capture - WORKING!</h1>
    <p><strong>Status:</strong> <span id="status">Ready</span></p>

    <!-- Widget -->
    <lemon-slice-widget agent-id="agent_1db77d60ec132469"></lemon-slice-widget>

    <button onclick="initializeSystem()">Initialize System</button>
    <button onclick="triggerTest()">Test Trigger (Simulate)</button>
    
    <div id="log"></div>

    <script type="module">
        import 'https://unpkg.com/@lemonsliceai/lemon-slice-widget';
        log('Widget loaded. Click "Initialize System" then speak to Botinia.');
    </script>

    <script>
        // ========== GLOBALS ==========
        let isInitialized = false;
        let audioContext = null;
        let recognition = null;
        const TRIGGER_PHRASE = "verified results gallery";

        // ========== LOGGING ==========
        function log(msg, type = 'info') {
            const el = document.createElement('div');
            el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (type === 'success') el.className = 'success';
            if (type === 'error') el.className = 'error';
            if (type === 'trigger') el.className = 'trigger';
            document.getElementById('log').appendChild(el);
            console.log(msg);
        }

        // ========== MAIN INITIALIZATION ==========
        function initializeSystem() {
            if (isInitialized) {
                log('System already initialized.', 'info');
                return;
            }
            
            log('Initializing audio capture system...');
            document.getElementById('status').textContent = 'Listening for Botinia...';
            
            // Get widget
            const widget = document.querySelector('lemon-slice-widget');
            if (!widget?.shadowRoot) {
                log('ERROR: Widget not found', 'error');
                return;
            }

            // Watch ALL audio elements for when Botinia speaks
            const audioElements = widget.shadowRoot.querySelectorAll('audio');
            log(`Found ${audioElements.length} audio elements in widget.`);
            
            audioElements.forEach((audio, index) => {
                // Listen for when audio starts playing (Botinia speaks)
                audio.addEventListener('play', function() {
                    if (isInitialized) return;
                    
                    log(`🎉 BOTINIA IS SPEAKING! Audio element #${index} active.`, 'success');
                    isInitialized = true;
                    
                    // Hook into the audio stream
                    try {
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                        const source = audioContext.createMediaElementSource(audio);
                        // Connect to destination so audio still plays
                        source.connect(audioContext.destination);
                        
                        log('✅ Audio stream CAPTURED successfully!', 'success');
                        document.getElementById('status').textContent = 'READY: Listening to Botinia...';
                        
                        // Start speech recognition
                        startSpeechRecognition();
                        
                    } catch (error) {
                        log(`Error: ${error.message}`, 'error');
                    }
                });
            });
            
            log('System initialized. Now speak to Botinia to activate capture.', 'success');
        }

        // ========== SPEECH RECOGNITION ==========
        function startSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window)) {
                log('ERROR: Web Speech API not supported in this browser.', 'error');
                return;
            }
            
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 3;
            
            recognition.onstart = function() {
                log('Speech recognition ACTIVE. Listening to Botinia...', 'success');
            };
            
            recognition.onresult = function(event) {
                let fullTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    fullTranscript += transcript + ' ';
                }
                
                const cleanTranscript = fullTranscript.toLowerCase().trim();
                log(`Botinia said: "${cleanTranscript.substring(0, 80)}${cleanTranscript.length > 80 ? '...' : ''}"`);
                
                // CHECK FOR TRIGGER PHRASE
                if (cleanTranscript.includes(TRIGGER_PHRASE)) {
                    log(`🎉🎉🎉 TRIGGER PHRASE DETECTED!`, 'trigger');
                    log(`Launching testimonial player...`, 'trigger');
                    document.getElementById('status').textContent = 'TRIGGERED! Launching testimonials...';
                    
                    // Stop listening
                    recognition.stop();
                    
                    // LAUNCH YOUR TESTIMONIAL PLAYER HERE

                                {
                                    title: "Personal Injury Lawyer 312% Boost",

                                }
                            ]
                        }
                    },
                    currentGroup: 'group_1769476426538'
                };
            }
            window.showTestimonialSplashScreen();
            log('✅ Testimonial player launched!', 'success');

                }
            };
            
            recognition.onerror = function(event) {
                log(`Recognition error: ${event.error}`, 'error');
            };
            
            recognition.onend = function() {
                log('Speech recognition ended.', 'info');
            };
            
            // Start recognition
            try {
                recognition.start();
            } catch (e) {
                log(`Cannot start recognition: ${e.message}`, 'error');
            }
        }

        // ========== LAUNCH TESTIMONIALS ==========
        function launchTestimonialPlayer() {
            log('🚀 LAUNCHING TESTIMONIAL PLAYER...', 'trigger');
            
            // YOUR EXISTING FUNCTION TO LOAD TESTIMONIALS
            if (typeof window.showTestimonialSplashScreen === 'function') {
                window.showTestimonialSplashScreen();
                log('✅ Testimonial player launched!', 'success');
            } else {
                log('Testimonial function not found. Loading player script...', 'info');
                // loadAndShowPlayer(); // Your existing function

        }

        // ========== TEST FUNCTION ==========
        function triggerTest() {
            log('Simulating trigger detection...', 'info');
            launchTestimonialPlayer();
        }
    </script>
