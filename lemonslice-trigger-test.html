<!DOCTYPE html>
<html>
<head>
    <title>Audio Capture TEST - FIXED</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #log { border: 2px solid #2ecc71; padding: 15px; margin-top: 20px; min-height: 300px; font-family: monospace; background: #f0fff4; }
        .success { color: #27ae60; font-weight: bold; }
        .error { color: #e74c3c; }
        .trigger { color: #f39c12; font-weight: bold; }
        button { background: #3498db; color: white; border: none; padding: 12px 24px; margin: 10px 5px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🎤 LemonSlice Audio Capture - WORKING!</h1>
    <p><strong>Status:</strong> <span id="status">Ready</span></p>

    <!-- Widget -->
    <lemon-slice-widget agent-id="agent_1db77d60ec132469"></lemon-slice-widget>

    <button onclick="initializeSystemForIntro()">
        🚀 Auto-Activate Botinia & Start Listening
    </button>
    <button onclick="triggerTest()">Test Trigger (Simulate)</button>

    <button onclick="manualMicSearch()">🔍 Debug: Show Widget Elements</button>

    <button onclick="forceTrigger()" style="background: #e74c3c;">
    🔥 FORCE Trigger Testimonial Player
</button>
    
    <div id="log"></div>

    <!-- AFTER the LemonSlice widget, add this: -->
    <div style="margin-top: 30px; border-top: 2px solid #444; padding-top: 20px;">
        <h3>🎬 Testimonial Player Area</h3>
        <div id="playerArea" style="min-height: 400px; background: #222; border-radius: 8px; padding: 20px;">
            <p style="text-align: center; color: #888; padding: 100px 20px;">
                Testimonial player will appear here when Botinia says "verified results gallery"
            </p>
        </div>
    </div>

    <!-- WIDGET LOADING SCRIPT -->
    <script type="module">
        import 'https://unpkg.com/@lemonsliceai/lemon-slice-widget';
        console.log('LemonSlice widget loaded. Click "Initialize System" then speak to Botinia.');
    </script>

       <script>
        // ========== COMPLETE WORKING VERSION ==========
        
        // ========== GLOBALS ==========
        let recognition = null;
        const TRIGGER_PHRASE = "verified results gallery";
        window.recognitionActive = false;
        window.playerLaunched = false;

        // ========== LOGGING ==========
        function log(msg, type = 'info') {
            const el = document.createElement('div');
            el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (type === 'success') el.className = 'success';
            if (type === 'error') el.className = 'error';
            if (type === 'trigger') el.className = 'trigger';
            document.getElementById('log').appendChild(el);
            console.log(msg);
        }

        // ========== MAIN INITIALIZATION ==========
        function initializeSystemForIntro() {
            log('🎧 Starting audio detection system...', 'info');
            document.getElementById('status').textContent = 'Starting detection...';
            
            // Start detection
            startUltimateAudioDetection();
        }

        // ========== ULTIMATE AUDIO DETECTION ==========
        function startUltimateAudioDetection() {
            log('🔊 Using multiple detection methods...', 'info');
            
            // METHOD 1: Monitor regular audio elements
            monitorAudioElements();
            
            // METHOD 2: Monitor for ANY sound playing on the page
            monitorSystemAudio();
            
            log('✅ Detection system active!', 'success');
            log('👆 NOW click video chat button in Botinia', 'info');
            document.getElementById('status').textContent = 'READY: Click Botinia\'s video chat button';
        }

        // ========== METHOD 1: MONITOR AUDIO ELEMENTS ==========
        function monitorAudioElements() {
            function checkAudioElements() {
                const widget = document.querySelector('lemon-slice-widget');
                if (!widget?.shadowRoot) {
                    setTimeout(checkAudioElements, 1000);
                    return;
                }
                
                const audioElements = widget.shadowRoot.querySelectorAll('audio');
                
                audioElements.forEach((audio, i) => {
                    audio.addEventListener('play', () => {
                        log(`🎬 Audio detected!`, 'success');
                        startSpeechRecognitionChain();
                    });
                    
                    if (!audio.paused && audio.currentTime > 0) {
                        log(`🔊 Audio already playing`, 'success');
                        startSpeechRecognitionChain();
                    }
                });
            }
            checkAudioElements();
        }

        // ========== METHOD 2: MONITOR SYSTEM AUDIO ==========
        function monitorSystemAudio() {
            function checkForAnyAudio() {
                const allMediaElements = [];
                
                document.querySelectorAll('audio, video').forEach(el => allMediaElements.push(el));
                
                document.querySelectorAll('*').forEach(el => {
                    if (el.shadowRoot) {
                        el.shadowRoot.querySelectorAll('audio, video').forEach(shadowEl => 
                            allMediaElements.push(shadowEl));
                    }
                });
                
                allMediaElements.forEach((media, i) => {
                    if (!media.paused && media.currentTime > 0) {
                        log(`📢 Found playing media`, 'success');
                        startSpeechRecognitionChain();
                    }
                });
                
                setTimeout(checkForAnyAudio, 1000);
            }
            checkForAnyAudio();
        }

        // ========== SPEECH RECOGNITION CHAIN ==========
        function startSpeechRecognitionChain() {
            if (window.recognitionStarted) return;
            window.recognitionStarted = true;
            
            log('⚡ Audio detected! Starting recognition...', 'success');
            document.getElementById('status').textContent = 'Getting mic permission...';
            
            getMicrophonePermission();
        }

        function getMicrophonePermission() {
            log('🎤 Requesting microphone permission...', 'info');
            
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    log('✅ Microphone permission GRANTED!', 'success');
                    stream.getTracks().forEach(track => track.stop());
                    startSpeechRecognition();
                })
                .catch(error => {
                    log(`❌ Microphone permission DENIED: ${error.message}`, 'error');
                    startSpeechRecognition();
                });
        }

        // ========== SPEECH RECOGNITION ==========
        function startSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window)) {
                log('❌ Web Speech API not supported', 'error');
                return;
            }
            
            log('👂 Starting speech recognition...', 'success');
            document.getElementById('status').textContent = 'Listening to Botinia...';
            
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            
            recognition.onstart = function() {
                log('✅ Speech recognition ACTIVE!', 'success');
                document.getElementById('status').textContent = 'Transcribing Botinia...';
            };
            
            recognition.onresult = function(event) {
                let fullTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    fullTranscript += event.results[i][0].transcript + ' ';
                }
                
                const cleanTranscript = fullTranscript.toLowerCase().trim();
                log(`📝 Botinia: "${cleanTranscript.substring(0, 80)}..."`);
                
                if (cleanTranscript.includes(TRIGGER_PHRASE) && !window.playerLaunched) {
                    window.playerLaunched = true;
                    log(`🎉🎉🎉 TRIGGER PHRASE DETECTED!`, 'trigger');
                    recognition.stop();
                    launchTestimonialPlayer();
                }
            };
            
            recognition.onerror = function(event) {
                log(`❌ Recognition error: ${event.error}`, 'error');
            };
            
            recognition.onend = function() {
                log('⏹️ Recognition ended', 'info');
                window.recognitionStarted = false;
            };
            
            try {
                recognition.start();
            } catch (e) {
                log(`❌ Cannot start: ${e.message}`, 'error');
            }
        }

        // ========== TESTIMONIAL PLAYER FUNCTIONS ==========
        function launchTestimonialPlayer() {
            log('🚀 TRIGGER DETECTED! Launching player...', 'trigger');
            document.getElementById('status').textContent = 'LAUNCHING testimonial player...';
            
            if (recognition && recognition.stop) {
                recognition.stop();
            }
            
            showTestimonialPlayerNow();
        }

        function showTestimonialPlayerNow() {
            const playerArea = document.getElementById('playerArea');
            if (!playerArea) {
                log('❌ Player area not found', 'error');
                return;
            }
            
            playerArea.innerHTML = '';
            playerArea.style.display = 'block';
            
            const playerHTML = `
                <div style="
                    background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%);
                    color: white;
                    border-radius: 15px;
                    padding: 30px;
                    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                    font-family: sans-serif;
                ">
                    <div style="text-align: center; margin-bottom: 30px;">
                        <h2 style="color: #3498db; margin-top: 0; font-size: 28px;">
                            🎬 VERIFIED RESULTS GALLERY
                        </h2>
                        <p style="color: #ecf0f1; font-size: 18px; margin-bottom: 10px;">
                            Successfully triggered by Botinia AI
                        </p>
                    </div>
                    
                    <div style="background: #34495e; padding: 25px; border-radius: 10px; margin-bottom: 25px;">
                        <h3 style="color: #f39c12; margin-top: 0;">
                            ✅ Personal Injury Lawyer - 312% Case Increase
                        </h3>
                        <p style="color: #ecf0f1; line-height: 1.6;">
                            <strong>Client:</strong> Law Firm Client<br>
                            <strong>Results:</strong> 312% increase in qualified cases<br>
                            <strong>Timeframe:</strong> 90 days
                        </p>
                    </div>
                    
                    <div style="text-align: center;">
                        <video 
                            controls 
                            autoplay
                            style="
                                width: 100%;
                                max-width: 600px;
                                margin: 0 auto 20px;
                                display: block;
                                border-radius: 10px;
                                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
                            ">
                            <source src="https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/videos/video_1764614248418.mp4" 
                                    type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                        
                        <div style="margin-top: 25px; padding-top: 20px; border-top: 2px solid #3498db;">
                            <p style="color: #2ecc71; font-weight: bold; font-size: 20px;">
                                🎉 SUCCESS! AI Trigger System Working!
                            </p>
                            <p style="color: #ecf0f1;">
                                Botinia → Trigger phrase → Player launched automatically
                            </p>
                        </div>
                    </div>
                </div>
            `;
            
            playerArea.innerHTML = playerHTML;
            log('✅ TESTIMONIAL PLAYER DISPLAYED!', 'success');
            document.getElementById('status').textContent = '🎬 Testimonial Player Active!';
            
            setTimeout(() => {
                playerArea.scrollIntoView({ behavior: 'smooth' });
            }, 500);
        }

        // ========== COMPATIBILITY FUNCTIONS ==========
        function loadAndShowPlayer() {
            showTestimonialPlayerNow();
        }

        function createTestimonialData() {
            window.testimonialData = {
                testimonialGroups: {
                    group_1769476426538: {
                        title: "Verified Results Gallery",
                        testimonials: [
                            {
                                title: "Personal Injury Lawyer 312% Boost",
                                author: "Law Firm Client",
                                concernType: "results",
                                hasVideoUrl: true,
                                videoUrl: "https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/videos/video_1764614248418.mp4"
                            }
                        ]
                    }
                },
                currentGroup: 'group_1769476426538'
            };
        }

        function showPlayer() {
            showTestimonialPlayerNow();
        }

        function showError() {
            const playerArea = document.getElementById('playerArea') || document.body;
            playerArea.innerHTML = `
                <div style="text-align: center; padding: 50px; color: #FF9800;">
                    <h3>⚠️ Player Load Issue</h3>
                    <p>Check console for errors.</p>
                    <button onclick="showTestimonialPlayerNow()" style="
                        background: #2196F3;
                        color: white;
                        border: none;
                        padding: 10px 20px;
                        border-radius: 5px;
                        cursor: pointer;
                        margin-top: 20px;
                    ">Show Player</button>
                </div>
            `;
        }

        // ========== TEST FUNCTIONS ==========
        function triggerTest() {
            log('Simulating trigger...', 'info');
            showTestimonialPlayerNow();
        }

        function manualMicSearch() {
            log('=== MANUAL MIC SEARCH ===', 'info');
            
            const widget = document.querySelector('lemon-slice-widget');
            if (!widget?.shadowRoot) return;
            
            const interactive = widget.shadowRoot.querySelectorAll('button, [role="button"]');
            log(`Found ${interactive.length} interactive elements`, 'info');
            
            interactive.forEach((el, i) => {
                const tag = el.tagName;
                const aria = el.getAttribute('aria-label') || '';
                log(`Element ${i}: ${tag} "${aria}"`, 'info');
            });
        }

        // ========== ADD DEBUG BUTTON ==========
        function addDebugButton() {
            const button = document.createElement('button');
            button.textContent = '🔍 Debug Player';
            button.style.cssText = 'background: #9b59b6; color: white; padding: 10px 15px; margin: 5px;';
            button.onclick = function() {
                log('🔍 Checking player area...', 'info');
                const playerArea = document.getElementById('playerArea');
                if (playerArea) {
                    log(`✅ Player area found. InnerHTML length: ${playerArea.innerHTML.length}`, 'success');
                    if (playerArea.innerHTML.length < 100) {
                        log('⚠️ Player area is empty or minimal', 'warning');
                        showTestimonialPlayerNow();
                    }
                } else {
                    log('❌ Player area not found', 'error');
                }
            };
            
            const existingButtons = document.querySelector('button[onclick="initializeSystemForIntro()"]');
            if (existingButtons) {
                existingButtons.parentNode.insertBefore(button, existingButtons.nextSibling);
            }
        }

        // ========== INITIALIZE ==========
        document.addEventListener('DOMContentLoaded', function() {
            log('Ready! Click "Auto-Activate Botinia" then click Botinia\'s video chat button.', 'info');
            addDebugButton();
        });
    </script>
</body>
</html>
