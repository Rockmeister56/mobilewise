<body>

    <p><strong>Status:</strong> <span id="status">Ready</span></p>

    <!-- Widget -->
    <lemon-slice-widget agent-id="agent_1db77d60ec132469"></lemon-slice-widget>

    <button onclick="initializeSystemForIntro()">
        🚀 Auto-Activate Botinia & Start Listening
    </button>
    <button onclick="triggerTest()">Test Trigger (Simulate)</button>

    <button onclick="manualMicSearch()">🔍 Debug: Show Widget Elements</button>

    <button onclick="forceTrigger()" style="background: #e74c3c;">
    🔥 FORCE Trigger Testimonial Player
</button>
    
    <div id="log"></div>

    <!-- AFTER the LemonSlice widget, add this: -->
    <div style="margin-top: 30px; border-top: 2px solid #444; padding-top: 20px;">

        <div id="playerArea" style="min-height: 400px; background: #222; border-radius: 8px; padding: 20px;">
            <p style="text-align: center; color: #888; padding: 100px 20px;">
                Testimonial player will appear here when Botinia says "verified results gallery"

        </div>
    </div>

    <!-- WIDGET LOADING SCRIPT -->
    <script type="module">
        import 'https://unpkg.com/@lemonsliceai/lemon-slice-widget';
        console.log('LemonSlice widget loaded. Click "Initialize System" then speak to Botinia.');
    </script>

    <!-- MAIN APPLICATION SCRIPT - SINGLE SCRIPT BLOCK -->
    <script>
        // ========== GLOBALS ==========
        let isInitialized = false;
        let audioContext = null;
        let recognition = null;
        const TRIGGER_PHRASE = "verified results gallery";

        // ========== LOGGING ==========
        function log(msg, type = 'info') {
            const el = document.createElement('div');
            el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (type === 'success') el.className = 'success';
            if (type === 'error') el.className = 'error';
            if (type === 'trigger') el.className = 'trigger';
            document.getElementById('log').appendChild(el);
            console.log(msg);
        }

        // ========== MAIN INITIALIZATION ==========
        function initializeSystemForIntro() {
    log('🎧 Setting up Botinia FREE INTRO capture...', 'info');
    document.getElementById('status').textContent = 'Ready! Now click the video chat button in Botinia widget';
    
    // IMMEDIATELY start listening for ANY audio
    startAudioDetectionNow();
    
    // Also show the trigger button as backup
    showIntroTriggerButton();
}

function forceTrigger() {
    log('🔥 FORCING testimonial player launch...', 'trigger');
    document.getElementById('status').textContent = 'FORCING testimonial player...';
    launchTestimonialPlayer();
}

// ========== NEW: IMMEDIATE AUDIO DETECTION ==========
function startAudioDetectionNow() {
    log('🔊 IMMEDIATELY starting audio detection...', 'info');
    
    // Start detection immediately and keep it running
    function startDetection() {
        const widget = document.querySelector('lemon-slice-widget');
        if (!widget?.shadowRoot) {
            log('Widget not ready yet, retrying...', 'warning');
            setTimeout(startDetection, 1000);
            return;
        }
        
        const audioElements = widget.shadowRoot.querySelectorAll('audio');
        log(`🔍 Found ${audioElements.length} audio elements to monitor`, 'info');
        
        let detectionActive = false;
        
        audioElements.forEach((audio, i) => {
            // Add play event listener
            audio.addEventListener('play', () => {
                if (!detectionActive) {
                    detectionActive = true;
                    log(`🎬 DETECTED! Audio #${i} is playing!`, 'success');
                    document.getElementById('status').textContent = 'Botinia is speaking!';
                    startSpeechRecognitionWithPermission();
                }
            });
            
            // Add ended listener to reset
            audio.addEventListener('ended', () => {
                detectionActive = false;
                log(`⏹️ Audio #${i} ended`, 'info');
            });
            
            // Check if already playing (in case we missed the start)
            if (!audio.paused && audio.currentTime > 0) {
                if (!detectionActive) {
                    detectionActive = true;
                    log(`▶️ Audio #${i} already playing when we checked`, 'success');
                    startSpeechRecognitionWithPermission();
                }
            }
        });
        
        // Also monitor for NEW audio elements being added
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.addedNodes.length) {
                    mutation.addedNodes.forEach((node) => {
                        if (node.tagName === 'AUDIO' || 
                            (node.querySelectorAll && node.querySelectorAll('audio').length)) {
                            log('🆕 New audio element detected in widget', 'info');
                            // Re-run detection to catch new audio elements
                            setTimeout(startDetection, 500);
                        }
                    });
                }
            });
        });
        
        observer.observe(widget.shadowRoot, {
            childList: true,
            subtree: true
        });
        
        log('✅ Audio detection system active!', 'success');
        log('Now click the video chat button in Botinia widget', 'info');
    }
    
    startDetection();
}

        // ========== SHOW USER TRIGGER BUTTON ==========
        function showIntroTriggerButton() {
            // Create or update a trigger button
            const existingButton = document.getElementById('triggerIntroBtn');
            
            if (!existingButton) {
                const button = document.createElement('button');
                button.id = 'triggerIntroBtn';
                button.textContent = '🎤 Trigger Botinia Intro';
                button.style.cssText = `
                    padding: 12px 24px;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    color: white;
                    border: none;
                    border-radius: 8px;
                    font-size: 16px;
                    font-weight: bold;
                    cursor: pointer;
                    margin: 10px 0;
                    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                    transition: transform 0.2s, box-shadow 0.2s;
                `;
                
                button.onmouseover = () => {
                    button.style.transform = 'translateY(-2px)';
                    button.style.boxShadow = '0 6px 20px rgba(0,0,0,0.25)';
                };
                
                button.onmouseout = () => {
                    button.style.transform = 'translateY(0)';
                    button.style.boxShadow = '0 4px 15px rgba(0,0,0,0.2)';
                };
                
                button.onclick = () => {
                    log('👆 User clicked to trigger intro...', 'success');
                    button.textContent = 'Triggering...';
                    button.disabled = true;
                    
                    // Now trigger intro after user interaction
                    triggerIntroAfterUserClick();
                };
                
                // Add after status
                const status = document.getElementById('status');
                status.parentNode.insertBefore(button, status.nextSibling);
                
                log('✅ Added "Trigger Intro" button for user interaction', 'info');
            }
        }

        // ========== TRIGGER INTRO AFTER USER CLICK ==========
        function triggerIntroAfterUserClick() {
    document.getElementById('status').textContent = 'Starting Botinia intro...';
    
    const widget = document.querySelector('lemon-slice-widget');
    if (!widget?.shadowRoot) {
        log('Widget not ready. Retrying...', 'warning');
        setTimeout(triggerIntroAfterUserClick, 500);
        return;
    }
    
    // First, ensure audio detection is running
    startAudioDetectionNow();
    
    // Then try to click the "video chat" button
    setTimeout(() => clickVideoChatButton(), 300);
}

function clickVideoChatButton() {
    const widget = document.querySelector('lemon-slice-widget');
    if (!widget?.shadowRoot) return false;
    
    const buttons = widget.shadowRoot.querySelectorAll('button');
    
    // From your debug log, we know:
    // Element 2: BUTTON "" "" class:w-11 h-11 flex-none rounded-fu
    // Element 3: BUTTON "" "" class:w-11 h-11 flex-none rounded-fu
    // One of these is likely the video chat button
    
    for (let i = 0; i < buttons.length; i++) {
        const className = buttons[i].className || '';
        const outerHTML = buttons[i].outerHTML || '';
        
        // Look for video/chat/camera icons or specific classes
        if (className.includes('w-11 h-11') && 
            className.includes('rounded-full') &&
            (className.includes('bg-white') || 
             outerHTML.includes('video') || 
             outerHTML.includes('chat') ||
             outerHTML.includes('camera') ||
             outerHTML.includes('▶') ||
             outerHTML.includes('🎥'))) {
            
            log(`🎥 Clicking potential video chat button #${i}`, 'success');
            buttons[i].click();
            return true;
        }
    }
    
    // If not found, click both empty buttons
    log('Trying all empty buttons...', 'info');
    let clicked = false;
    buttons.forEach((button, i) => {
        if (button.textContent === '' && !button.getAttribute('aria-label')?.includes('close')) {
            log(`Clicking empty button #${i}`, 'info');
            button.click();
            clicked = true;
        }
    });
    
    return clicked;
}

        // ========== STRATEGY 1: Find and click mic button ==========
        function tryStrategy1() {
            const widget = document.querySelector('lemon-slice-widget');
            if (!widget?.shadowRoot) return false;
            
            const buttons = widget.shadowRoot.querySelectorAll('button');
            
            for (let i = 0; i < buttons.length; i++) {
                const btnText = buttons[i].textContent?.toLowerCase() || '';
                const ariaLabel = buttons[i].getAttribute('aria-label')?.toLowerCase() || '';
                const className = buttons[i].className || '';
                
                // Look for mic/audio/play buttons
                if (ariaLabel.includes('microphone') || 
                    ariaLabel.includes('mic') ||
                    ariaLabel.includes('audio') ||
                    ariaLabel.includes('voice') ||
                    ariaLabel.includes('speak') ||
                    className.includes('mic') ||
                    className.includes('audio') ||
                    btnText.includes('🎤') ||
                    btnText.includes('▶') ||
                    btnText.includes('talk') ||
                    btnText.includes('chat')) {
                    
                    log(`Strategy 1: Clicking mic button #${i} (aria: "${ariaLabel}")`, 'info');
                    buttons[i].click();
                    return true;
                }
            }
            
            return false;
        }

        // ========== STRATEGY 2: Click any non-close button ==========
        function tryStrategy2() {
            const widget = document.querySelector('lemon-slice-widget');
            if (!widget?.shadowRoot) return false;
            
            const buttons = widget.shadowRoot.querySelectorAll('button');
            
            for (let i = 0; i < buttons.length; i++) {
                const ariaLabel = buttons[i].getAttribute('aria-label')?.toLowerCase() || '';
                
                // Skip close/minimize buttons
                if (ariaLabel.includes('close') || 
                    ariaLabel.includes('minimize') || 
                    ariaLabel.includes('collapse')) {
                    continue;
                }
                
                log(`Strategy 2: Clicking button #${i} (aria: "${ariaLabel}")`, 'info');
                buttons[i].click();
                return true;
            }
            
            return false;
        }

        // ========== STRATEGY 3: Simulate spacebar press ==========
        function tryStrategy3() {
            log('Strategy 3: Simulating keyboard interaction', 'info');
            
            // Simulate spacebar press
            const spaceEvent = new KeyboardEvent('keydown', {
                key: ' ',
                code: 'Space',
                keyCode: 32,
                bubbles: true,
                cancelable: true
            });
            
            document.dispatchEvent(spaceEvent);
            
            // Also try enter key
            setTimeout(() => {
                const enterEvent = new KeyboardEvent('keydown', {
                    key: 'Enter',
                    code: 'Enter',
                    keyCode: 13,
                    bubbles: true
                });
                document.dispatchEvent(enterEvent);
            }, 50);
            
            return true;
        }

        // ========== CAPTURE INTRO AUDIO FUNCTION ==========
        function captureIntroAudioOnly() {
            log('🎧 Listening for Botinia audio...', 'info');
            document.getElementById('status').textContent = 'Listening for intro audio...';
            
            let checkAttempts = 0;
            const maxAttempts = 30;
            
            function checkAudio() {
                checkAttempts++;
                
                const widget = document.querySelector('lemon-slice-widget');
                if (!widget?.shadowRoot) {
                    if (checkAttempts < maxAttempts) {
                        setTimeout(checkAudio, 1000);
                    } else {
                        log('❌ Widget not found after multiple attempts', 'error');
                    }
                    return;
                }
                
                const audioElements = widget.shadowRoot.querySelectorAll('audio');
                let audioPlaying = false;
                
                // Check each audio element
                audioElements.forEach((audio, i) => {
                    // Add event listener if not already added
                    if (!audio._listenerAdded) {
                        audio.addEventListener('play', () => {
                            log(`🎬 Audio #${i} started playing!`, 'success');
                            document.getElementById('status').textContent = 'Botinia is speaking!';
                            startSpeechRecognitionWithPermission();
                        });
                        audio._listenerAdded = true;
                    }
                    
                    // Check if currently playing
                    if (!audio.paused && audio.currentTime > 0) {
                        log(`✅ Detected active audio in element #${i}`, 'success');
                        audioPlaying = true;
                        startSpeechRecognitionWithPermission();
                    }
                });
                
                if (!audioPlaying && checkAttempts < maxAttempts) {
                    // Update status message
                    if (checkAttempts % 5 === 0) {
                        document.getElementById('status').textContent = 
                            `Listening for audio... (${checkAttempts}s elapsed)`;
                    }
                    setTimeout(checkAudio, 1000);
                } else if (checkAttempts >= maxAttempts) {
                    log('⏰ Timeout waiting for audio', 'warning');
                    document.getElementById('status').textContent = 'Audio timeout. Try clicking Botinia\'s mic button.';
                }
            }
            
            checkAudio();
        }

        // ========== SPEECH RECOGNITION WITH PERMISSION ==========
        function startSpeechRecognitionWithPermission() {
            if (window.recognitionActive) return;
            window.recognitionActive = true;
            
            log('Requesting microphone permission...', 'info');
            
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    stream.getTracks().forEach(track => track.stop());
                    log('✅ Permission granted. Listening to Botinia...', 'success');
                    startSpeechRecognition();
                })
                .catch(error => {
                    log(`❌ Microphone permission denied: ${error.message}`, 'error');
                });
        }

        // ========== LEGACY FUNCTIONS (keep for compatibility) ==========
        function activateWidgetMicButton() {
            log('⚠️ Skipping button activation (using free intro only)', 'info');
            document.getElementById('status').textContent = 'Using free intro, no activation needed';
            captureIntroAudioOnly();
        }

        // ========== MANUAL DEBUG FUNCTIONS ==========
        function manualMicSearch() {
            log('=== MANUAL MIC SEARCH ===', 'info');
            
            const widget = document.querySelector('lemon-slice-widget');
            if (!widget?.shadowRoot) return;
            
            const interactive = widget.shadowRoot.querySelectorAll('button, [role="button"], [tabindex], [onclick]');
            log(`Found ${interactive.length} interactive elements`, 'info');
            
            interactive.forEach((el, i) => {
                const tag = el.tagName;
                const aria = el.getAttribute('aria-label') || el.getAttribute('title') || '';
                const cls = el.className;
                const text = el.textContent.trim().substring(0, 30);
                
                log(`Element ${i}: ${tag} "${aria}" "${text}" class:${cls.substring(0, 30)}`, 'info');
                
                console.log(`Element ${i}:`, {
                    tagName: tag,
                    ariaLabel: el.getAttribute('aria-label'),
                    title: el.getAttribute('title'),
                    className: cls,
                    textContent: text,
                    outerHTML: el.outerHTML.substring(0, 150)
                });
            });
        }

        // ========== SPEECH RECOGNITION ==========
        function startSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window)) {
                log('ERROR: Web Speech API not supported in this browser.', 'error');
                return;
            }
            
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 3;
            
            recognition.onstart = function() {
                log('Speech recognition ACTIVE. Listening to Botinia...', 'success');
            };
            
            recognition.onresult = function(event) {
                let fullTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    fullTranscript += transcript + ' ';
                }
                
                const cleanTranscript = fullTranscript.toLowerCase().trim();
                log(`Botinia said: "${cleanTranscript.substring(0, 80)}${cleanTranscript.length > 80 ? '...' : ''}"`);
                
                // CHECK FOR TRIGGER PHRASE
                if (cleanTranscript.includes(TRIGGER_PHRASE)) {
                    log(`🎉🎉🎉 TRIGGER PHRASE DETECTED!`, 'trigger');
                    log(`Launching testimonial player...`, 'trigger');
                    document.getElementById('status').textContent = 'TRIGGERED! Launching testimonials...';
                    
                    // Stop listening
                    recognition.stop();
                    
                    // LAUNCH YOUR TESTIMONIAL PLAYER
                    launchTestimonialPlayer();
                }
            };
            
            recognition.onerror = function(event) {
                log(`Recognition error: ${event.error}`, 'error');
            };
            
            recognition.onend = function() {
                log('Speech recognition ended.', 'info');
            };
            
            // Start recognition
            try {
                recognition.start();
            } catch (e) {
                log(`Cannot start recognition: ${e.message}`, 'error');
            }
        }

        // ========== TESTIMONIAL PLAYER FUNCTIONS ==========
        function launchTestimonialPlayer() {
            log('🚀 TRIGGER DETECTED! Launching testimonial player...', 'trigger');
            document.getElementById('status').textContent = 'TRIGGERED! Loading testimonials...';
            loadAndShowPlayer();
        }

        function loadAndShowPlayer() {
            log(`🚀 Loading testimonial player...`, "info");
            
            if (typeof window.showTestimonialSplashScreen === 'function') {
                createTestimonialData();
                showPlayer();
                return;
            }
            
            const script = document.createElement('script');
            script.src = 'testimonial-player.js';
            
            script.onload = function() {
                log(`✅ testimonial-player.js loaded`, "success");
                createTestimonialData();
                showPlayer();
            };
            
            script.onerror = function() {
                log(`❌ Failed to load testimonial-player.js`, "error");
                showError();
            };
            
            document.head.appendChild(script);
        }

        function createTestimonialData() {
            if (!window.testimonialData) {
                window.testimonialData = {
                    testimonialGroups: {
                        group_1769476426538: {
                            title: "Verified Results Gallery",
                            testimonials: [
                                {
                                    title: "Personal Injury Lawyer 312% Boost",
                                    author: "Law Firm Client",
                                    concernType: "results",
                                    hasVideoUrl: true,
                                    videoUrl: "https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/videos/video_1764614248418.mp4"
                                }
                            ]
                        }
                    },
                    currentGroup: 'group_1769476426538'
                };
                log(`📦 Created testimonial data`, "success");
            }
        }

        function showPlayer() {
            const playerArea = document.getElementById('playerArea');
            if (!playerArea) {
                log(`❌ ERROR: #playerArea div not found in HTML!`, "error");
                return;
            }
            
            playerArea.innerHTML = '';
            
            const chatMessages = document.createElement('div');
            chatMessages.id = 'chatMessages';
            chatMessages.style.cssText = `position: relative; width: 100%; min-height: 400px; background: #1a1a1a;`;
            playerArea.appendChild(chatMessages);
            
            log(`📦 Created #chatMessages inside #playerArea`, "success");
            
            try {
                window.showTestimonialSplashScreen();
                log(`✅ Testimonial player launched`, "success");
                document.getElementById('status').textContent = 'Testimonial Player Active!';
            } catch (error) {
                log(`❌ Error: ${error.message}`, "error");
                showError();
            }
        }

        function showError() {
            const playerArea = document.getElementById('playerArea') || document.body;
            playerArea.innerHTML = `
                <div style="text-align: center; padding: 50px; color: #FF9800;">
                    <h3>⚠️ Player Load Issue</h3>
                    <p>Check console for errors. Make sure testimonial-player.js is in same folder.</p>
                    <button onclick="loadAndShowPlayer()" style="
                        background: #2196F3;
                        color: white;
                        border: none;
                        padding: 10px 20px;
                        border-radius: 5px;
                        cursor: pointer;
                        margin-top: 20px;
                    ">Try Again</button>
                </div>
            `;
        }

        // ========== TEST FUNCTION ==========
        function triggerTest() {
            log('Simulating trigger detection...', 'info');
            launchTestimonialPlayer();
        }

        // ========== INITIAL PAGE LOG ==========
        document.addEventListener('DOMContentLoaded', function() {
            log('Ready! Click "Auto-Activate Botinia & Start Listening" to begin.', 'info');
        });
    </script>
</body>
