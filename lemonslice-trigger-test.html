<!DOCTYPE html>
<html>
<head>
    <title>Audio Capture TEST - FIXED</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #log { border: 2px solid #2ecc71; padding: 15px; margin-top: 20px; min-height: 300px; font-family: monospace; background: #f0fff4; }
        .success { color: #27ae60; font-weight: bold; }
        .error { color: #e74c3c; }
        .trigger { color: #f39c12; font-weight: bold; }
        button { background: #3498db; color: white; border: none; padding: 12px 24px; margin: 10px 5px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🎤 LemonSlice Audio Capture - WORKING!</h1>
    <p><strong>Status:</strong> <span id="status">Ready</span></p>

    <!-- Widget -->
    <lemon-slice-widget agent-id="agent_1db77d60ec132469"></lemon-slice-widget>

    <button onclick="initializeSystemForIntro()">
        🚀 Auto-Activate Botinia & Start Listening
    </button>
    <button onclick="triggerTest()">Test Trigger (Simulate)</button>

    <button onclick="manualMicSearch()">🔍 Debug: Show Widget Elements</button>

    <button onclick="forceTrigger()" style="background: #e74c3c;">
    🔥 FORCE Trigger Testimonial Player
</button>
    
    <div id="log"></div>

    <!-- AFTER the LemonSlice widget, add this: -->
    <div style="margin-top: 30px; border-top: 2px solid #444; padding-top: 20px;">
        <h3>🎬 Testimonial Player Area</h3>
        <div id="playerArea" style="min-height: 400px; background: #222; border-radius: 8px; padding: 20px;">
            <p style="text-align: center; color: #888; padding: 100px 20px;">
                Testimonial player will appear here when Botinia says "verified results gallery"
            </p>
        </div>
    </div>

    <!-- WIDGET LOADING SCRIPT -->
    <script type="module">
        import 'https://unpkg.com/@lemonsliceai/lemon-slice-widget';
        console.log('LemonSlice widget loaded. Click "Initialize System" then speak to Botinia.');
    </script>

    <!-- MAIN APPLICATION SCRIPT - SINGLE SCRIPT BLOCK -->
    <script>
                // ========== DEBUG VERSION ==========
        // This will show us EXACTLY where the system stops working
        
        // ========== GLOBALS ==========
        let recognition = null;
        const TRIGGER_PHRASE = "verified results gallery";
        window.recognitionActive = false;
        window.debugMode = true;

        // ========== LOGGING ==========
        function log(msg, type = 'info') {
            const el = document.createElement('div');
            el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (type === 'success') el.className = 'success';
            if (type === 'error') el.className = 'error';
            if (type === 'trigger') el.className = 'trigger';
            if (type === 'debug') el.className = 'trigger';
            document.getElementById('log').appendChild(el);
            console.log(msg);
        }

        // ========== DEBUG FUNCTION ==========
        function debugLog(step) {
            if (window.debugMode) {
                log(`🔍 DEBUG STEP: ${step}`, 'debug');
            }
        }

        // ========== MAIN INITIALIZATION ==========
        function initializeSystemForIntro() {
            log('🎧 DEBUG MODE: Starting FULL detection chain...', 'info');
            document.getElementById('status').textContent = 'DEBUG: Starting all systems...';
            
            debugLog('1. Initialization started');
            
            // Start the ENTIRE chain step by step
            startFullDetectionChain();
        }

        // ========== FULL DETECTION CHAIN ==========
        function startFullDetectionChain() {
            debugLog('2. Starting full detection chain');
            
            // Step 1: Set up audio detection
            setupAudioDetection();
            
            // Step 2: After a moment, also show the trigger button
            setTimeout(() => {
                showIntroTriggerButton();
            }, 1000);
        }

        // ========== SETUP AUDIO DETECTION ==========
        function setupAudioDetection() {
            debugLog('3. Setting up audio detection');
            
            let checkCount = 0;
            const maxChecks = 10;
            
            function checkForWidget() {
                checkCount++;
                debugLog(`3.${checkCount}. Checking for widget...`);
                
                const widget = document.querySelector('lemon-slice-widget');
                
                if (!widget) {
                    log(`❌ Widget element not found (check ${checkCount}/${maxChecks})`, 'error');
                    if (checkCount < maxChecks) {
                        setTimeout(checkForWidget, 1000);
                    }
                    return;
                }
                
                debugLog('4. Widget element found');
                
                if (!widget.shadowRoot) {
                    log(`⚠️ Widget shadowRoot not ready (check ${checkCount}/${maxChecks})`, 'warning');
                    if (checkCount < maxChecks) {
                        setTimeout(checkForWidget, 1000);
                    }
                    return;
                }
                
                debugLog('5. Widget shadowRoot ready');
                startMonitoringAudio(widget);
            }
            
            checkForWidget();
        }

        // ========== START MONITORING AUDIO ==========
        function startMonitoringAudio(widget) {
            debugLog('6. Starting to monitor audio elements');
            
            const audioElements = widget.shadowRoot.querySelectorAll('audio');
            log(`🎯 Found ${audioElements.length} audio elements to monitor`, 'success');
            
            if (audioElements.length === 0) {
                log('❌ ERROR: No audio elements found in widget!', 'error');
                return;
            }
            
            // Monitor each audio element
            audioElements.forEach((audio, i) => {
                debugLog(`7. Setting up listener for audio element #${i}`);
                
                // Add play event listener
                audio.addEventListener('play', () => {
                    log(`🎬 SUCCESS: Audio element #${i} STARTED PLAYING!`, 'success');
                    debugLog(`8. Audio play event triggered for element #${i}`);
                    
                    // Check audio details
                    console.log(`Audio ${i} details:`, {
                        src: audio.src,
                        currentSrc: audio.currentSrc,
                        currentTime: audio.currentTime,
                        duration: audio.duration,
                        paused: audio.paused,
                        volume: audio.volume
                    });
                    
                    // Now request permission and start recognition
                    requestMicrophonePermission();
                });
                
                // Add error listener
                audio.addEventListener('error', (e) => {
                    log(`❌ Audio element #${i} error: ${e.message}`, 'error');
                });
                
                // Check if already playing
                if (!audio.paused && audio.currentTime > 0) {
                    log(`▶️ Audio element #${i} is already playing!`, 'success');
                    requestMicrophonePermission();
                }
                
                // Log audio element details
                console.log(`Audio element ${i}:`, {
                    tagName: audio.tagName,
                    src: audio.src,
                    currentSrc: audio.currentSrc,
                    paused: audio.paused,
                    currentTime: audio.currentTime,
                    duration: audio.duration
                });
            });
            
            // Also monitor for new audio elements
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if (mutation.addedNodes.length) {
                        log('🆕 New nodes added to widget', 'info');
                        // Re-check for audio elements
                        setTimeout(() => startMonitoringAudio(widget), 500);
                    }
                });
            });
            
            observer.observe(widget.shadowRoot, {
                childList: true,
                subtree: true
            });
            
            log('✅ Audio monitoring system ACTIVE!', 'success');
            log('👆 NOW click the video chat button in Botinia', 'info');
            document.getElementById('status').textContent = 'READY: Click Botinia\'s video chat button';
        }

        // ========== REQUEST MICROPHONE PERMISSION ==========
        function requestMicrophonePermission() {
            if (window.recognitionActive) {
                debugLog('9. Recognition already active, skipping');
                return;
            }
            
            debugLog('9. Requesting microphone permission');
            log('🎤 Requesting microphone access...', 'info');
            
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    debugLog('10. Microphone permission GRANTED');
                    log('✅ Microphone permission GRANTED!', 'success');
                    
                    // Stop the stream (we don't need to record)
                    stream.getTracks().forEach(track => track.stop());
                    
                    // Start speech recognition
                    startSpeechRecognition();
                })
                .catch(error => {
                    debugLog(`10. Microphone permission DENIED: ${error.message}`);
                    log(`❌ Microphone permission DENIED: ${error.message}`, 'error');
                    
                    // For testing, try to start recognition anyway
                    log('⚠️ Trying to start recognition without permission for testing...', 'warning');
                    startSpeechRecognition();
                });
        }

        // ========== SPEECH RECOGNITION ==========
        function startSpeechRecognition() {
            debugLog('11. Starting speech recognition');
            
            if (!('webkitSpeechRecognition' in window)) {
                log('❌ Web Speech API not supported in this browser', 'error');
                return;
            }
            
            log('🎤 Speech recognition STARTING...', 'success');
            window.recognitionActive = true;
            
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 3;
            
            recognition.onstart = function() {
                debugLog('12. Speech recognition ACTIVE');
                log('✅ Speech recognition ACTIVE! Listening to Botinia...', 'success');
                document.getElementById('status').textContent = 'LISTENING: Transcribing Botinia...';
                
                // TEST: Simulate hearing something after 2 seconds
                setTimeout(() => {
                    if (!window.hasHeardAnything) {
                        log('⚠️ TEST: No speech detected yet. Simulating test phrase...', 'warning');
                        simulateHearingPhrase();
                    }
                }, 2000);
            };
            
            recognition.onresult = function(event) {
                debugLog('13. Speech recognition result received');
                window.hasHeardAnything = true;
                
                let fullTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    fullTranscript += transcript + ' ';
                }
                
                const cleanTranscript = fullTranscript.toLowerCase().trim();
                log(`📝 Botinia said: "${cleanTranscript}"`, 'info');
                
                // Display first 100 characters in status
                document.getElementById('status').textContent = 
                    `Transcribing: "${cleanTranscript.substring(0, 100)}${cleanTranscript.length > 100 ? '...' : ''}"`;
                
                // CHECK FOR TRIGGER PHRASE
                if (cleanTranscript.includes(TRIGGER_PHRASE)) {
                    debugLog('14. TRIGGER PHRASE DETECTED!');
                    log(`🎉🎉🎉 TRIGGER PHRASE DETECTED!`, 'trigger');
                    log(`Launching testimonial player...`, 'trigger');
                    
                    // Stop listening
                    recognition.stop();
                    
                    // Launch testimonial player
                    launchTestimonialPlayer();
                }
            };
            
            recognition.onerror = function(event) {
                debugLog(`15. Speech recognition ERROR: ${event.error}`);
                log(`❌ Recognition error: ${event.error}`, 'error');
                
                if (event.error === 'not-allowed') {
                    log('⚠️ Microphone access was denied. Click the microphone icon in your browser address bar.', 'error');
                }
            };
            
            recognition.onend = function() {
                debugLog('16. Speech recognition ENDED');
                log('⏹️ Speech recognition ended', 'info');
                window.recognitionActive = false;
            };
            
            // Start recognition
            try {
                recognition.start();
            } catch (e) {
                log(`❌ Cannot start recognition: ${e.message}`, 'error');
            }
        }

        // ========== TEST FUNCTION ==========
        function simulateHearingPhrase() {
            log('🎭 TEST: Simulating hearing "verified results gallery"', 'debug');
            
            // Simulate the trigger phrase
            if (typeof recognition !== 'undefined' && recognition) {
                // Create a fake event
                const fakeEvent = {
                    resultIndex: 0,
                    results: [[{
                        transcript: 'verified results gallery',
                        confidence: 0.9
                    }]]
                };
                
                // Call onresult manually
                recognition.onresult(fakeEvent);
            } else {
                // If recognition isn't running, just launch the player
                launchTestimonialPlayer();
            }
        }

        // ========== TESTIMONIAL PLAYER FUNCTIONS (KEEP AS IS) ==========
        function launchTestimonialPlayer() {
            log('🚀 TRIGGER DETECTED! Launching testimonial player...', 'trigger');
            document.getElementById('status').textContent = 'TRIGGERED! Loading testimonials...';
            loadAndShowPlayer();
        }

        function loadAndShowPlayer() {
            log(`🚀 Loading testimonial player...`, "info");
            
            if (typeof window.showTestimonialSplashScreen === 'function') {
                createTestimonialData();
                showPlayer();
                return;
            }
            
            const script = document.createElement('script');
            script.src = 'testimonial-player.js';
            
            script.onload = function() {
                log(`✅ testimonial-player.js loaded`, "success");
                createTestimonialData();
                showPlayer();
            };
            
            script.onerror = function() {
                log(`❌ Failed to load testimonial-player.js`, "error");
                showError();
            };
            
            document.head.appendChild(script);
        }

        function createTestimonialData() {
            if (!window.testimonialData) {
                window.testimonialData = {
                    testimonialGroups: {
                        group_1769476426538: {
                            title: "Verified Results Gallery",
                            testimonials: [
                                {
                                    title: "Personal Injury Lawyer 312% Boost",
                                    author: "Law Firm Client",
                                    concernType: "results",
                                    hasVideoUrl: true,
                                    videoUrl: "https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/videos/video_1764614248418.mp4"
                                }
                            ]
                        }
                    },
                    currentGroup: 'group_1769476426538'
                };
                log(`📦 Created testimonial data`, "success");
            }
        }

        function showPlayer() {
            const playerArea = document.getElementById('playerArea');
            if (!playerArea) {
                log(`❌ ERROR: #playerArea div not found in HTML!`, "error");
                return;
            }
            
            playerArea.innerHTML = '';
            
            const chatMessages = document.createElement('div');
            chatMessages.id = 'chatMessages';
            chatMessages.style.cssText = `position: relative; width: 100%; min-height: 400px; background: #1a1a1a;`;
            playerArea.appendChild(chatMessages);
            
            log(`📦 Created #chatMessages inside #playerArea`, "success");
            
            try {
                window.showTestimonialSplashScreen();
                log(`✅ Testimonial player launched`, "success");
                document.getElementById('status').textContent = 'Testimonial Player Active!';
            } catch (error) {
                log(`❌ Error: ${error.message}`, "error");
                showError();
            }
        }

        function showError() {
            const playerArea = document.getElementById('playerArea') || document.body;
            playerArea.innerHTML = `
                <div style="text-align: center; padding: 50px; color: #FF9800;">
                    <h3>⚠️ Player Load Issue</h3>
                    <p>Check console for errors. Make sure testimonial-player.js is in same folder.</p>
                    <button onclick="loadAndShowPlayer()" style="
                        background: #2196F3;
                        color: white;
                        border: none;
                        padding: 10px 20px;
                        border-radius: 5px;
                        cursor: pointer;
                        margin-top: 20px;
                    ">Try Again</button>
                </div>
            `;
        }

        // ========== BUTTON FUNCTIONS ==========
        function showIntroTriggerButton() {
            // ... keep your existing showIntroTriggerButton function ...
        }

        function triggerIntroAfterUserClick() {
            // ... keep your existing triggerIntroAfterUserClick function ...
        }

        function manualMicSearch() {
            // ... keep your existing manualMicSearch function ...
        }

        function triggerTest() {
            log('Simulating trigger detection...', 'info');
            launchTestimonialPlayer();
        }

        // ========== ADD TEST BUTTONS ==========
        function addTestButtons() {
            const testDiv = document.createElement('div');
            testDiv.style.cssText = 'margin: 20px 0; padding: 10px; background: #f0f0f0; border-radius: 5px;';
            
            testDiv.innerHTML = `
                <h4>🔧 Test Controls:</h4>
                <button onclick="simulateHearingPhrase()" style="background: #9b59b6;">🎭 Simulate Trigger Phrase</button>
                <button onclick="requestMicrophonePermission()" style="background: #e67e22;">🎤 Test Mic Permission</button>
                <button onclick="startSpeechRecognition()" style="background: #27ae60;">👂 Test Speech Recognition</button>
            `;
            
            document.getElementById('log').parentNode.insertBefore(testDiv, document.getElementById('log'));
        }

        // ========== INITIAL PAGE LOG ==========
        document.addEventListener('DOMContentLoaded', function() {
            log('Ready! Click "Auto-Activate Botinia & Start Listening" to begin.', 'info');
            addTestButtons();
        });
    </script>
</body>
</html>
