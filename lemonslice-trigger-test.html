function initializeSystemForIntro() {
    log('🎤 WAITING for user to click mic button in widget...', 'info');
    document.getElementById('status').textContent = 'Click the MIC button in the widget first!';
    
    // Get widget
    const widget = document.querySelector('lemon-slice-widget');
    if (!widget?.shadowRoot) {
        log('Widget not ready. Retrying...', 'warning');
        setTimeout(initializeSystemForIntro, 1000);
        return;
    }
    
    const audioElements = widget.shadowRoot.querySelectorAll('audio');
    log(`Found ${audioElements.length} audio elements. Waiting for mic activation...`, 'info');
    
    // STRATEGY: Watch for WHEN audio elements get their stream (after mic click)
    audioElements.forEach((audio, index) => {
        // 1. Listen for src changes (stream assignment happens AFTER mic click)
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'src' && audio.src) {
                    log(`🎯 Audio element #${index} got stream AFTER mic click!`, 'success');
                    captureAudioAndStartRecognition(audio, index);
                }
            });
        });
        observer.observe(audio, { attributes: true, attributeFilter: ['src', 'currentSrc'] });
        
        // 2. Also listen for playback
        audio.addEventListener('play', () => {
            log(`▶️ Audio #${index} playing (after mic click)`, 'success');
            captureAudioAndStartRecognition(audio, index);
        });
    });
    
    log('System READY. Now: 1) Click MIC in widget, 2) Speak to Botinia', 'success');
}

// NEW HELPER FUNCTION
function captureAudioAndStartRecognition(audioElement, index) {
    if (window.hasCapturedAudio) return;
    window.hasCapturedAudio = true;
    
    log(`✅ CAPTURED Audio #${index}! Starting recognition...`, 'success');
    document.getElementById('status').textContent = 'Transcribing Botinia...';
    
    // Connect to Web Audio API
    try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaElementSource(audioElement);
        source.connect(audioContext.destination);
        log('Web Audio connected', 'success');
    } catch (e) {
        log(`Audio error: ${e.message}`, 'error');
    }
    
    // CRITICAL: Request microphone permission before starting recognition
    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
            // We have permission (but don't use the stream)
            stream.getTracks().forEach(track => track.stop());
            log('✅ Microphone permission granted', 'success');
            
            // NOW start speech recognition
            startSpeechRecognition();
        })
        .catch(error => {
            log(`❌ Microphone permission DENIED: ${error.message}`, 'error');
            log('System cannot work without microphone access', 'error');
        });
}

// ========== TWO-STEP WIDGET ACTIVATION ==========
function activateWidgetMicButton() {
    log('🔍 Starting two-step widget activation...', 'info');
    
    const widget = document.querySelector('lemon-slice-widget');
    if (!widget?.shadowRoot) {
        log('Widget not ready. Retrying...', 'warning');
        setTimeout(activateWidgetMicButton, 1000);
        return;
    }
    
    const allButtons = widget.shadowRoot.querySelectorAll('button');
    log(`Found ${allButtons.length} buttons in widget`, 'info');
    
    // STEP 1: Look for "Open widget" button first
    let openButton = null;
    let micButton = null;
    
    for (const button of allButtons) {
        const ariaLabel = button.getAttribute('aria-label')?.toLowerCase() || '';
        const className = button.className.toLowerCase();
        
        // Button that opens/expands the widget
        if (ariaLabel.includes('open widget') || ariaLabel.includes('expand') || 
            ariaLabel.includes('start') || className.includes('open')) {
            openButton = button;
            log('Found "Open widget" button', 'success');
        }
        
        // Actual mic button (might not exist yet if widget is closed)
        if (ariaLabel.includes('mic') || ariaLabel.includes('microphone') || 
            ariaLabel.includes('speak') || ariaLabel.includes('talk') ||
            className.includes('mic') || className.includes('speak')) {
            micButton = button;
            log('Found potential mic button', 'success');
        }
    }
    
    // STEP 2: If widget is closed, open it first
    if (openButton && !micButton) {
        log('📱 Widget appears closed. Clicking "Open widget" first...', 'success');
        openButton.click();
        
        // Wait for widget to expand, THEN look for mic button
        setTimeout(() => {
            log('Widget should be open now. Looking for mic button...', 'info');
            findAndClickMicButton();
        }, 1500); // Wait 1.5 seconds for animation
        
        return;
    }
    
    // STEP 3: If mic button is already visible, click it
    if (micButton) {
        log('🎤 Mic button found! Clicking it...', 'success');
        micButton.click();
        
        setTimeout(() => {
            initializeAudioCapture();
        }, 1000);
        return;
    }
    
    // STEP 4: Last resort - try to interact with widget directly
    log('Could not find standard buttons. Trying direct interaction...', 'warning');
    tryDirectWidgetInteraction();
}

// ========== FIND MIC BUTTON AFTER WIDGET OPENS ==========
function findAndClickMicButton() {
    const widget = document.querySelector('lemon-slice-widget');
    if (!widget?.shadowRoot) return;
    
    // Look for mic button now that widget is open
    const buttons = widget.shadowRoot.querySelectorAll('button');
    
    for (const button of buttons) {
        const ariaLabel = button.getAttribute('aria-label')?.toLowerCase() || '';
        const className = button.className.toLowerCase();
        const text = button.textContent.toLowerCase();
        
        // Look for MIC-related buttons
        const isMicButton = ariaLabel.includes('mic') || ariaLabel.includes('microphone') ||
                           ariaLabel.includes('speak') || ariaLabel.includes('talk') ||
                           ariaLabel.includes('start') || ariaLabel.includes('begin') ||
                           className.includes('mic') || className.includes('speak') ||
                           text.includes('mic') || text.includes('speak');
        
        if (isMicButton) {
            log(`🎤 Found REAL mic button: ${ariaLabel || text}`, 'success');
            console.log('Real mic button:', {
                ariaLabel: button.getAttribute('aria-label'),
                className: button.className,
                innerHTML: button.innerHTML.substring(0, 100)
            });
            
            button.click();
            log('Real mic button clicked!', 'success');
            
            setTimeout(() => {
                initializeAudioCapture();
            }, 1000);
            return;
        }
    }
    
    log('❌ Still cannot find mic button after opening widget', 'error');
    log('Please click the mic button manually in the widget', 'error');
}

// ========== DIRECT INTERACTION (Fallback) ==========
function tryDirectWidgetInteraction() {
    log('Trying direct widget interaction...', 'info');
    
    const widget = document.querySelector('lemon-slice-widget');
    if (!widget) return;
    
    // Method 1: Try to focus and press Enter (common activation)
    widget.focus();
    widget.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter' }));
    log('Sent Enter key to widget', 'info');
    
    // Method 2: Look for input/textarea and simulate typing
    const inputs = widget.shadowRoot?.querySelectorAll('input, textarea') || [];
    if (inputs.length > 0) {
        inputs[0].focus();
        log('Focused input in widget', 'info');
    }
    
    // Method 3: Try to trigger any clickable area
    const clickable = widget.shadowRoot?.querySelector('[role="button"], [onclick], .clickable') || widget;
    clickable.click();
    log('Clicked main widget area', 'info');
    
    // Then try to find mic button again
    setTimeout(() => {
        findAndClickMicButton();
    }, 2000);
}

// ========== SIMPLIFIED AUDIO CAPTURE ==========
function initializeAudioCapture() {
    log('Starting audio capture after mic activation...', 'info');
    
    const widget = document.querySelector('lemon-slice-widget');
    if (!widget?.shadowRoot) return;
    
    const audioElements = widget.shadowRoot.querySelectorAll('audio');
    log(`Monitoring ${audioElements.length} audio elements for stream...`, 'info');
    
    audioElements.forEach((audio, index) => {
        // Watch for stream assignment
        const observer = new MutationObserver(() => {
            if (audio.src || audio.currentSrc) {
                log(`🎯 Audio #${index} got stream!`, 'success');
                startSpeechRecognitionWithPermission();
                observer.disconnect(); // Stop watching
            }
        });
        observer.observe(audio, { attributes: true, attributeFilter: ['src', 'currentSrc'] });
        
        // Also listen for playback
        audio.addEventListener('play', () => {
            log(`▶️ Audio #${index} playing!`, 'success');
            startSpeechRecognitionWithPermission();
        });
    });
}

// ========== REQUEST MIC PERMISSION ==========
function startSpeechRecognitionWithPermission() {
    if (window.recognitionStarted) return;
    window.recognitionStarted = true;
    
    log('Requesting microphone permission for speech recognition...', 'info');
    
    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
            stream.getTracks().forEach(track => track.stop()); // Don't actually record
            log('✅ Microphone permission granted', 'success');
            startSpeechRecognition(); // Your existing function
        })
        .catch(error => {
            log(`❌ Microphone permission denied: ${error.message}`, 'error');
        });
}

        // ========== SPEECH RECOGNITION ==========
        function startSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window)) {
                log('ERROR: Web Speech API not supported in this browser.', 'error');
                return;
            }
            
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 3;
            
            recognition.onstart = function() {
                log('Speech recognition ACTIVE. Listening to Botinia...', 'success');
            };
            
            recognition.onresult = function(event) {
                let fullTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    fullTranscript += transcript + ' ';
                }
                
                const cleanTranscript = fullTranscript.toLowerCase().trim();
                log(`Botinia said: "${cleanTranscript.substring(0, 80)}${cleanTranscript.length > 80 ? '...' : ''}"`);
                
                // CHECK FOR TRIGGER PHRASE
                if (cleanTranscript.includes(TRIGGER_PHRASE)) {
                    log(`🎉🎉🎉 TRIGGER PHRASE DETECTED!`, 'trigger');
                    log(`Launching testimonial player...`, 'trigger');
                    document.getElementById('status').textContent = 'TRIGGERED! Launching testimonials...';
                    
                    // Stop listening
                    recognition.stop();
                    
                    // LAUNCH YOUR TESTIMONIAL PLAYER HERE
                    launchTestimonialPlayer();
                }
            };
            
            recognition.onerror = function(event) {
                log(`Recognition error: ${event.error}`, 'error');
            };
            
            recognition.onend = function() {
                log('Speech recognition ended.', 'info');
            };
            
            // Start recognition
            try {
                recognition.start();
            } catch (e) {
                log(`Cannot start recognition: ${e.message}`, 'error');
            }
        }
