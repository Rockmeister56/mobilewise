<body>

    <lemon-slice-widget agent-id="agent_1db77d60ec132469"></lemon-slice-widget>

        🚀 Auto-Activate Botinia & Start Listening
    </button>

    🔥 FORCE Trigger Testimonial Player
</button>
    
    <div id="log"></div>

    <!-- AFTER the LemonSlice widget, add this: -->

        <h3>🎬 Testimonial Player Area</h3>
        <div id="playerArea" style="min-height: 400px; background: #222; border-radius: 8px; padding: 20px;">
            <p style="text-align: center; color: #888; padding: 100px 20px;">
                Testimonial player will appear here when Botinia says "verified results gallery"
            </p>
        </div>
    </div>

    <!-- WIDGET LOADING SCRIPT -->
    <script type="module">
        import 'https://unpkg.com/@lemonsliceai/lemon-slice-widget';
        console.log('LemonSlice widget loaded. Click "Initialize System" then speak to Botinia.');
    </script>

    <!-- MAIN APPLICATION SCRIPT - SINGLE SCRIPT BLOCK -->
    <script>
                // ========== FIXED VERSION - DETECTS ANY AUDIO ==========
        
        // ========== GLOBALS ==========
        let recognition = null;
        const TRIGGER_PHRASE = "verified results gallery";
        window.recognitionActive = false;

        // ========== LOGGING ==========
        function log(msg, type = 'info') {
            const el = document.createElement('div');
            el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (type === 'success') el.className = 'success';
            if (type === 'error') el.className = 'error';
            if (type === 'trigger') el.className = 'trigger';
            document.getElementById('log').appendChild(el);
            console.log(msg);
        }

        // ========== MAIN INITIALIZATION ==========
        function initializeSystemForIntro() {
            log('🎧 Starting ULTIMATE audio detection system...', 'info');
            document.getElementById('status').textContent = 'Starting detection...';
            
            // Use MULTIPLE detection methods
            startUltimateAudioDetection();
        }

        // ========== ULTIMATE AUDIO DETECTION ==========
        function startUltimateAudioDetection() {
            log('🔊 Using 3 detection methods to catch ANY Botinia audio...', 'info');
            
            // METHOD 1: Monitor regular audio elements
            monitorAudioElements();
            
            // METHOD 2: Monitor Web Audio API usage
            monitorWebAudioAPI();
            
            // METHOD 3: Monitor for ANY sound playing on the page
            monitorSystemAudio();
            
            log('✅ ALL detection methods active!', 'success');
            log('👆 NOW click video chat button in Botinia', 'info');
            document.getElementById('status').textContent = 'READY: Click Botinia\'s video chat button';
        }

        // ========== METHOD 1: MONITOR AUDIO ELEMENTS ==========
        function monitorAudioElements() {
            log('1️⃣ Monitoring HTML5 audio elements...', 'info');
            
            function checkAudioElements() {
                const widget = document.querySelector('lemon-slice-widget');
                if (!widget?.shadowRoot) {
                    setTimeout(checkAudioElements, 1000);
                    return;
                }
                
                const audioElements = widget.shadowRoot.querySelectorAll('audio');
                
                audioElements.forEach((audio, i) => {
                    // Listen for playback
                    audio.addEventListener('play', () => {
                        log(`🎬 HTML5 Audio #${i} playing!`, 'success');
                        startSpeechRecognitionChain();
                    });
                    
                    // Also listen for 'playing' event
                    audio.addEventListener('playing', () => {
                        log(`▶️ HTML5 Audio #${i} is playing`, 'success');
                        startSpeechRecognitionChain();
                    });
                    
                    // Check if already playing
                    if (!audio.paused && audio.currentTime > 0) {
                        log(`🔊 HTML5 Audio #${i} already playing`, 'success');
                        startSpeechRecognitionChain();
                    }
                });
            }
            
            checkAudioElements();
        }

        // ========== METHOD 2: MONITOR WEB AUDIO API ==========
        function monitorWebAudioAPI() {
            log('2️⃣ Monitoring Web Audio API...', 'info');
            
            // Hook into Web Audio API if it exists
            if (window.AudioContext || window.webkitAudioContext) {
                const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
                
                // Override createBufferSource to detect audio creation
                const originalCreateBufferSource = AudioContext.prototype.createBufferSource;
                
                AudioContext.prototype.createBufferSource = function() {
                    const source = originalCreateBufferSource.call(this);
                    
                    const originalStart = source.start;
                    source.start = function(...args) {
                        log('🎵 Web Audio API: Audio buffer started playing!', 'success');
                        startSpeechRecognitionChain();
                        return originalStart.apply(this, args);
                    };
                    
                    return source;
                };
                
                // Also monitor createMediaElementSource
                const originalCreateMediaElementSource = AudioContext.prototype.createMediaElementSource;
                AudioContext.prototype.createMediaElementSource = function(element) {
                    log('🔗 Web Audio API: Connected to media element', 'info');
                    startSpeechRecognitionChain();
                    return originalCreateMediaElementSource.call(this, element);
                };
            }
        }

        // ========== METHOD 3: MONITOR SYSTEM AUDIO ==========
        function monitorSystemAudio() {
            log('3️⃣ Monitoring for ANY page audio...', 'info');
            
            // Check every second if ANY audio is playing on the page
            let lastCheck = Date.now();
            
            function checkForAnyAudio() {
                // Get ALL audio/video elements in entire document (including shadow DOMs)
                const allMediaElements = [];
                
                // Regular audio/video elements
                document.querySelectorAll('audio, video').forEach(el => allMediaElements.push(el));
                
                // Check inside shadow DOMs
                document.querySelectorAll('*').forEach(el => {
                    if (el.shadowRoot) {
                        el.shadowRoot.querySelectorAll('audio, video').forEach(shadowEl => 
                            allMediaElements.push(shadowEl));
                    }
                });
                
                let anyPlaying = false;
                
                allMediaElements.forEach((media, i) => {
                    if (!media.paused && media.currentTime > 0) {
                        anyPlaying = true;
                        if (Date.now() - lastCheck > 2000) { // Log every 2 seconds max
                            log(`📢 Found playing media: ${media.tagName} #${i}`, 'success');
                            lastCheck = Date.now();
                            startSpeechRecognitionChain();
                        }
                    }
                });
                
                // Also check if document has audio context (Chrome/Edge)
                if (document.hasAudioContext && document.hasAudioContext()) {
                    log('🔊 Document reports having audio context', 'success');
                    startSpeechRecognitionChain();
                }
                
                setTimeout(checkForAnyAudio, 1000);
            }
            
            checkForAnyAudio();
        }

        // ========== SPEECH RECOGNITION CHAIN ==========
        function startSpeechRecognitionChain() {
            if (window.recognitionStarted) return;
            window.recognitionStarted = true;
            
            log('⚡ Audio detected! Starting recognition chain...', 'success');
            document.getElementById('status').textContent = 'Audio detected! Getting mic permission...';
            
            // Step 1: Get microphone permission
            getMicrophonePermission();
        }

        function getMicrophonePermission() {
            log('🎤 Requesting microphone permission...', 'info');
            
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    log('✅ Microphone permission GRANTED!', 'success');
                    stream.getTracks().forEach(track => track.stop());
                    
                    // Step 2: Start speech recognition
                    startSpeechRecognition();
                })
                .catch(error => {
                    log(`❌ Microphone permission DENIED: ${error.message}`, 'error');
                    log('⚠️ Will try to continue without permission...', 'warning');
                    
                    // Try to start recognition anyway
                    startSpeechRecognition();
                });
        }

        // ========== SPEECH RECOGNITION ==========
        function startSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window)) {
                log('❌ Web Speech API not supported', 'error');
                return;
            }
            
            log('👂 Starting speech recognition...', 'success');
            document.getElementById('status').textContent = 'Listening to Botinia...';
            
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 3;
            
            recognition.onstart = function() {
                log('✅ Speech recognition ACTIVE! Transcribing...', 'success');
                document.getElementById('status').textContent = 'Transcribing Botinia...';
            };
            
            recognition.onresult = function(event) {
                let fullTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    fullTranscript += event.results[i][0].transcript + ' ';
                }
                
                const cleanTranscript = fullTranscript.toLowerCase().trim();
                log(`📝 Botinia: "${cleanTranscript.substring(0, 100)}${cleanTranscript.length > 100 ? '...' : ''}"`);
                
                // Check for trigger phrase
                if (cleanTranscript.includes(TRIGGER_PHRASE)) {
                    log(`🎉🎉🎉 TRIGGER PHRASE DETECTED!`, 'trigger');
                    recognition.stop();
                    launchTestimonialPlayer();
                }
            };
            
            recognition.onerror = function(event) {
                log(`❌ Recognition error: ${event.error}`, 'error');
            };
            
            recognition.onend = function() {
                log('⏹️ Recognition ended', 'info');
                window.recognitionStarted = false;
            };
            
            try {
                recognition.start();
            } catch (e) {
                log(`❌ Cannot start: ${e.message}`, 'error');
            }
        }

        // ========== SIMPLE TEST ==========
        function simulateAudioDetection() {
            log('🔊 SIMULATING audio detection...', 'info');
            startSpeechRecognitionChain();
        }

        // ========== TEST BUTTONS ==========
        function addTestButtons() {
            const container = document.getElementById('log').parentNode;
            const testDiv = document.createElement('div');
            testDiv.innerHTML = `
                <div style="margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 2px solid #3498db;">
                    <h4 style="margin-top: 0; color: #3498db;">🔧 Test Controls:</h4>
                    <button onclick="simulateAudioDetection()" style="background: #9b59b6; margin: 5px;">
                        🔊 Simulate Audio Detection
                    </button>
                    <button onclick="getMicrophonePermission()" style="background: #e67e22; margin: 5px;">
                        🎤 Test Mic Permission
                    </button>
                    <button onclick="startSpeechRecognition()" style="background: #27ae60; margin: 5px;">
                        👂 Test Speech Recognition
                    </button>
                    <button onclick="launchTestimonialPlayer()" style="background: #e74c3c; margin: 5px;">
                        🚀 Force Launch Player
                    </button>
                </div>
            `;
            container.insertBefore(testDiv, document.getElementById('log'));
        }

        // ========== KEEP YOUR EXISTING FUNCTIONS ==========
        // (Add all your existing testimonial player functions here)
        function launchTestimonialPlayer() {
            log('🚀 Launching testimonial player...', 'trigger');
            document.getElementById('status').textContent = 'Loading testimonials...';
            // ... your existing launchTestimonialPlayer code ...
            loadAndShowPlayer();
        }

        function loadAndShowPlayer() {
            // ... your existing loadAndShowPlayer code ...
        }

        function createTestimonialData() {
            // ... your existing createTestimonialData code ...
        }

        function showPlayer() {
            // ... your existing showPlayer code ...
        }

        function showError() {
            // ... your existing showError code ...
        }

        function triggerTest() {
            log('Simulating trigger...', 'info');
            launchTestimonialPlayer();
        }

        function manualMicSearch() {
            // ... your existing manualMicSearch code ...
        }

        // ========== INITIALIZE ==========
        document.addEventListener('DOMContentLoaded', function() {
            log('Ready! Click "Auto-Activate Botinia" then click video chat button.', 'info');
            addTestButtons();
        });
    </script>
</body>
