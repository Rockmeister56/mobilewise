function initializeSystemForIntro() {
    log('🎤 WAITING for user to click mic button in widget...', 'info');
    document.getElementById('status').textContent = 'Click the MIC button in the widget first!';
    
    // Get widget
    const widget = document.querySelector('lemon-slice-widget');
    if (!widget?.shadowRoot) {
        log('Widget not ready. Retrying...', 'warning');
        setTimeout(initializeSystemForIntro, 1000);
        return;
    }
    
    const audioElements = widget.shadowRoot.querySelectorAll('audio');
    log(`Found ${audioElements.length} audio elements. Waiting for mic activation...`, 'info');
    
    // STRATEGY: Watch for WHEN audio elements get their stream (after mic click)
    audioElements.forEach((audio, index) => {
        // 1. Listen for src changes (stream assignment happens AFTER mic click)
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'src' && audio.src) {
                    log(`🎯 Audio element #${index} got stream AFTER mic click!`, 'success');
                    captureAudioAndStartRecognition(audio, index);
                }
            });
        });
        observer.observe(audio, { attributes: true, attributeFilter: ['src', 'currentSrc'] });
        
        // 2. Also listen for playback
        audio.addEventListener('play', () => {
            log(`▶️ Audio #${index} playing (after mic click)`, 'success');
            captureAudioAndStartRecognition(audio, index);
        });
    });
    
    log('System READY. Now: 1) Click MIC in widget, 2) Speak to Botinia', 'success');
}

// NEW HELPER FUNCTION
function captureAudioAndStartRecognition(audioElement, index) {
    if (window.hasCapturedAudio) return;
    window.hasCapturedAudio = true;
    
    log(`✅ CAPTURED Audio #${index}! Starting recognition...`, 'success');
    document.getElementById('status').textContent = 'Transcribing Botinia...';
    
    // Connect to Web Audio API
    try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioContext.createMediaElementSource(audioElement);
        source.connect(audioContext.destination);
        log('Web Audio connected', 'success');
    } catch (e) {
        log(`Audio error: ${e.message}`, 'error');
    }
    
    // CRITICAL: Request microphone permission before starting recognition
    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
            // We have permission (but don't use the stream)
            stream.getTracks().forEach(track => track.stop());
            log('✅ Microphone permission granted', 'success');
            
            // NOW start speech recognition
            startSpeechRecognition();
        })
        .catch(error => {
            log(`❌ Microphone permission DENIED: ${error.message}`, 'error');
            log('System cannot work without microphone access', 'error');
        });
}

// ========== FIXED: AUTO-CLICK MIC BUTTON ==========
function activateWidgetMicButton() {
    log('🔍 Looking for mic button in widget...', 'info');
    
    const widget = document.querySelector('lemon-slice-widget');
    if (!widget?.shadowRoot) {
        log('Widget not ready. Retrying...', 'warning');
        setTimeout(activateWidgetMicButton, 1000);
        return;
    }
    
    // Search for mic button - FIXED SELECTOR
    const allButtons = widget.shadowRoot.querySelectorAll('button');
    log(`Found ${allButtons.length} buttons in widget`, 'info');
    
    let micButton = null;
    
    // STRATEGY 1: Find the ACTUAL button (not SVG inside it)
    // Look for button CONTAINING an SVG (common for mic icons)
    for (const button of allButtons) {
        // Check if button contains an SVG (mic icon)
        const hasSVG = button.querySelector('svg') !== null;
        // Check aria-label or title for mic-related text
        const ariaLabel = button.getAttribute('aria-label')?.toLowerCase() || '';
        const title = button.getAttribute('title')?.toLowerCase() || '';
        const className = button.className.toLowerCase();
        
        if (hasSVG || ariaLabel.includes('mic') || title.includes('mic') || 
            ariaLabel.includes('start') || title.includes('start') ||
            className.includes('mic') || className.includes('start')) {
            micButton = button;
            log('Found mic button by content/attributes', 'success');
            console.log('Mic button details:', {
                tagName: micButton.tagName,
                className: micButton.className,
                ariaLabel: micButton.getAttribute('aria-label'),
                title: micButton.getAttribute('title'),
                hasSVG: micButton.querySelector('svg') !== null
            });
            break;
        }
    }
    
    // STRATEGY 2: If still not found, try the LAST button (often the mic)
    if (!micButton && allButtons.length > 0) {
        micButton = allButtons[allButtons.length - 1];
        log('Using last button as fallback mic button', 'warning');
    }
    
    // CLICK THE BUTTON if found
    if (micButton && typeof micButton.click === 'function') {
        log(`🎤 AUTO-CLICKING mic button (${micButton.tagName})...`, 'success');
        console.log('Clicking button:', micButton);
        
        // Try multiple click methods
        try {
            // Method 1: Standard click
            micButton.click();
            log('Standard click() executed', 'success');
        } catch (e) {
            log(`Standard click failed: ${e.message}`, 'error');
            
            // Method 2: Mouse events
            try {
                const clickEvent = new MouseEvent('click', {
                    bubbles: true,
                    cancelable: true,
                    view: window
                });
                micButton.dispatchEvent(clickEvent);
                log('MouseEvent click dispatched', 'success');
            } catch (e2) {
                log(`MouseEvent failed: ${e2.message}`, 'error');
            }
        }
        
        document.getElementById('status').textContent = 'Mic activated! Starting audio capture...';
        
        // Start audio capture
        setTimeout(() => {
            initializeAudioCapture();
        }, 2000); // Give more time for activation
        
    } else {
        log('❌ Could not find clickable mic button', 'error');
        document.getElementById('status').textContent = 'Please click mic button manually';
        
        // DEBUG: Show all buttons found
        allButtons.forEach((btn, i) => {
            log(`Button ${i}: ${btn.tagName} - aria-label="${btn.getAttribute('aria-label')}"`, 'info');
        });
    }
}

// ========== SIMPLIFIED AUDIO CAPTURE ==========
function initializeAudioCapture() {
    log('Starting audio capture after mic activation...', 'info');
    
    const widget = document.querySelector('lemon-slice-widget');
    if (!widget?.shadowRoot) return;
    
    const audioElements = widget.shadowRoot.querySelectorAll('audio');
    log(`Monitoring ${audioElements.length} audio elements for stream...`, 'info');
    
    audioElements.forEach((audio, index) => {
        // Watch for stream assignment
        const observer = new MutationObserver(() => {
            if (audio.src || audio.currentSrc) {
                log(`🎯 Audio #${index} got stream!`, 'success');
                startSpeechRecognitionWithPermission();
                observer.disconnect(); // Stop watching
            }
        });
        observer.observe(audio, { attributes: true, attributeFilter: ['src', 'currentSrc'] });
        
        // Also listen for playback
        audio.addEventListener('play', () => {
            log(`▶️ Audio #${index} playing!`, 'success');
            startSpeechRecognitionWithPermission();
        });
    });
}

// ========== REQUEST MIC PERMISSION ==========
function startSpeechRecognitionWithPermission() {
    if (window.recognitionStarted) return;
    window.recognitionStarted = true;
    
    log('Requesting microphone permission for speech recognition...', 'info');
    
    navigator.mediaDevices.getUserMedia({ audio: true })
        .then(stream => {
            stream.getTracks().forEach(track => track.stop()); // Don't actually record
            log('✅ Microphone permission granted', 'success');
            startSpeechRecognition(); // Your existing function
        })
        .catch(error => {
            log(`❌ Microphone permission denied: ${error.message}`, 'error');
        });
}

        // ========== SPEECH RECOGNITION ==========
        function startSpeechRecognition() {
            if (!('webkitSpeechRecognition' in window)) {
                log('ERROR: Web Speech API not supported in this browser.', 'error');
                return;
            }
            
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.maxAlternatives = 3;
            
            recognition.onstart = function() {
                log('Speech recognition ACTIVE. Listening to Botinia...', 'success');
            };
            
            recognition.onresult = function(event) {
                let fullTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    fullTranscript += transcript + ' ';
                }
                
                const cleanTranscript = fullTranscript.toLowerCase().trim();
                log(`Botinia said: "${cleanTranscript.substring(0, 80)}${cleanTranscript.length > 80 ? '...' : ''}"`);
                
                // CHECK FOR TRIGGER PHRASE
                if (cleanTranscript.includes(TRIGGER_PHRASE)) {
                    log(`🎉🎉🎉 TRIGGER PHRASE DETECTED!`, 'trigger');
                    log(`Launching testimonial player...`, 'trigger');
                    document.getElementById('status').textContent = 'TRIGGERED! Launching testimonials...';
                    
                    // Stop listening
                    recognition.stop();
                    
                    // LAUNCH YOUR TESTIMONIAL PLAYER HERE
                    launchTestimonialPlayer();
                }
            };
            
            recognition.onerror = function(event) {
                log(`Recognition error: ${event.error}`, 'error');
            };
            
            recognition.onend = function() {
                log('Speech recognition ended.', 'info');
            };
            
            // Start recognition
            try {
                recognition.start();
            } catch (e) {
                log(`Cannot start recognition: ${e.message}`, 'error');
            }
        }
