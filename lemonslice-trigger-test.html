<!DOCTYPE html>
<html>
<head>
    <title>Simple Audio Capture Test</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #log { border: 2px solid #ccc; padding: 15px; margin-top: 20px; min-height: 200px; font-family: monospace; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🎤 Simple LemonSlice Audio Capture Test</h1>
    <p><strong>GOAL:</strong> Capture the LIVE audio stream when Botinia speaks.</p>

    <!-- Widget -->
    <lemon-slice-widget agent-id="agent_1db77d60ec132469"></lemon-slice-widget>

    <button onclick="captureAudio()">Start Capturing Audio</button>
    <div id="log"></div>

    <!-- Widget Script -->
    <script type="module">
        import 'https://unpkg.com/@lemonsliceai/lemon-slice-widget';
        log('Widget loaded.');
    </script>

    <script>
        function log(msg, type = 'info') {
            const el = document.createElement('div');
            el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (type === 'success') el.className = 'success';
            if (type === 'error') el.className = 'error';
            document.getElementById('log').appendChild(el);
            console.log(msg);
        }

        function captureAudio() {
            log('Trying to capture audio stream...');
            
            // Get widget
            const widget = document.querySelector('lemon-slice-widget');
            if (!widget || !widget.shadowRoot) {
                log('ERROR: Widget not found', 'error');
                return;
            }

            // Watch ALL 5 audio elements for when they get a src
            const audioElements = widget.shadowRoot.querySelectorAll('audio');
            log(`Found ${audioElements.length} audio elements`);
            
            let captured = false;
            
            audioElements.forEach((audio, index) => {
                // Listen for when audio starts playing (stream is assigned)
                audio.addEventListener('play', function() {
                    if (captured) return;
                    captured = true;
                    
                    log(`🎉 SUCCESS: Audio element #${index} is PLAYING!`, 'success');
                    log(`Stream source: ${audio.src || audio.currentSrc}`, 'success');
                    
                    // TEST: Try to hook this to Web Audio API
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const source = audioContext.createMediaElementSource(audio);
                    
                    log('Audio Context created. Stream is CAPTURED!', 'success');
                    log('NOW make Botinia say "verified results gallery"', 'success');
                    
                    // Now we can add speech recognition here
                    setupSpeechRecognition(audio);
                });
                
                // Also check if src gets set
                const observer = new MutationObserver(() => {
                    if (audio.src || audio.currentSrc) {
                        log(`Audio #${index} got src: ${audio.src || audio.currentSrc}`);
                    }
                });
                observer.observe(audio, { attributes: true, attributeFilter: ['src'] });
            });
        }

        function setupSpeechRecognition(audioElement) {
            log('Setting up speech recognition on captured audio...');
            
            // We need to use the Web Speech API
            if (!('webkitSpeechRecognition' in window)) {
                log('ERROR: Web Speech API not supported', 'error');
                return;
            }
            
            const recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            
            recognition.onresult = function(event) {
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript.toLowerCase();
                    log(`Heard: "${transcript}"`);
                    
                    if (transcript.includes('verified results gallery')) {
                        log('🎉🎉🎉 TRIGGER PHRASE DETECTED!', 'success');
                        recognition.stop();
                        // Here you would call your testimonial player
                        log('Would launch testimonial player now...', 'success');
                    }
                }
            };
            
            recognition.start();
            log('Speech recognition started. Speak to Botinia now!');
        }
    </script>
</body>
</html>
