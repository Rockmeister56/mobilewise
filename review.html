<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #050a12;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .splash-screen {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            z-index: 100; padding: 20px;
        }
        .splash-bg {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
        }
        .splash-bg::after {
            content: ''; position: absolute; inset: 0;
            background: rgba(0,0,0,0.45);
        }
        .splash-card {
            position: relative; z-index: 1;
            background: rgba(18,28,46,0.85);
            border-radius: 24px; padding: 40px 30px 30px;
            max-width: 420px; width: 100%; text-align: center;
            border: 2px solid rgba(248,196,0,0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .logo-overlay { height: 40px; margin-bottom: 16px; }
        .avatar-container {
            width: 200px; height: 300px;
            margin: 0 auto 20px; border-radius: 16px;
            overflow: hidden; background: #000;
            border: 2px solid rgba(255,255,255,0.2);
            position: relative;
        }
        .avatar-container video {
            width: 100%; height: 100%; object-fit: cover;
        }
        .btn-listen {
            display: inline-block; padding: 16px 36px;
            border-radius: 50px; font-weight: 700; font-size: 1.05rem;
            cursor: pointer; border: none;
            background: linear-gradient(135deg, #f8c400, #e6a800);
            color: #0a0f1e;
            box-shadow: 0 8px 30px rgba(248,196,0,0.3);
            transition: all 0.3s;
        }
        .btn-listen:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(248,196,0,0.5); }
        .btn-listen:disabled { background: #666; cursor: not-allowed; box-shadow: none; }
        .splash-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; color: #f8c400; }
        .splash-subtitle { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 20px; }
        
        .interview-overlay {
            position: fixed; inset: 0; z-index: 200;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.85); padding: 20px;
        }
        .interview-overlay.active { display: flex; }
        .interview-card {
            background: rgba(18,28,46,0.95);
            border-radius: 20px; padding: 30px;
            max-width: 500px; width: 100%; text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .interview-card h2 { font-size: 1.3rem; margin-bottom: 12px; }
        .interview-card .subtitle { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 20px; }
        
        .btn {
            display: inline-block; padding: 14px 28px;
            border-radius: 50px; font-weight: 600; font-size: 0.95rem;
            cursor: pointer; border: none; transition: all 0.2s; margin: 6px;
        }
        .btn-gold { background: #f8c400; color: #0a0f1e; }
        .btn-green { background: #00c853; color: #0a0f1e; }
        .btn-red { background: #f44336; color: white; }
        .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.3); color: white; }
        .btn-gold:hover, .btn-green:hover { transform: translateY(-2px); }
        
        .recording-dot {
            display: inline-block; width: 12px; height: 12px;
            background: #f44336; border-radius: 50%;
            animation: pulse 1s infinite; margin-right: 8px;
        }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
        
        .video-box {
            width: 100%; border-radius: 12px; overflow: hidden;
            background: #000; aspect-ratio: 16/9; margin-bottom: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
        }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        
        .accept-redo { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
        .progress-row { display: flex; justify-content: center; gap: 6px; margin: 10px 0; }
        .pdot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); }
        .pdot.done { background: #00c853; }
        .pdot.current { background: #f8c400; animation: pulse 1s infinite; }
        
        .complaint-box {
            background: rgba(244,67,54,0.1);
            border: 1px solid rgba(244,67,54,0.3);
            border-radius: 12px; padding: 20px; margin-top: 12px; text-align: center;
        }
        .incentive-box {
            background: rgba(255,152,0,0.1);
            border: 1px solid rgba(255,152,0,0.3);
            border-radius: 12px; padding: 16px; margin-top: 12px;
        }
        .thank-icon { font-size: 3.5rem; margin-bottom: 12px; }
        .powered-by {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.25); font-size: 0.7rem; z-index: 300;
        }
        .tess-speaking {
            border: 2px solid #f8c400 !important;
            box-shadow: 0 0 20px rgba(248,196,0,0.3);
        }
    </style>
</head>
<body>

<div class="splash-screen" id="splashScreen">
    <div class="splash-bg" id="splashBg"></div>
    <div class="splash-card">
        <img id="logoOverlay" class="logo-overlay" src="" alt="Logo" style="display:none;">
        <div class="splash-title" id="splashTitle">A Special Thank You</div>
        <div class="splash-subtitle" id="splashSubtitle">We appreciate your trust in us</div>
        <div class="avatar-container" id="avatarContainer">
            <video id="silentTessVideo" src="" muted loop playsinline autoplay style="display:none;"></video>
        </div>
        <button class="btn-listen" id="btnListen" onclick="activateTess()">🎧 Listen to Your Personal Thank You</button>
    </div>
</div>

<div class="interview-overlay" id="interviewOverlay">
    <div class="interview-card" id="interviewContent"></div>
</div>

<p class="powered-by">Powered by MobileWise AI</p>

<!-- Daily SDK -->
<script src="https://unpkg.com/@daily-co/daily-js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const clientId = urlParams.get('clientId') || 'demo';
    const firstName = urlParams.get('name') || 'Valued Customer';
    
    const SUPABASE_URL = "https://fcgbusobfdwnpoqyuzoe.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjZ2J1c29iZmR3bnBvcXl1em9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzNDA2MjMsImV4cCI6MjA4NTkxNjYyM30.FHEZnxuGHSn_Z3gw9d_Txtfz5Jn55J6qonl8rnA3gPk";
    
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    emailjs.init("7-9oxa3UC3uKxtqGM");
    
    let reviewConfig = {};
    let dailyCallObject = null;
    let currentQuestionIndex = 0;
    let recordings = [];
    let mediaRecorder = null;
    let recordedChunks = [];
    let stream = null;
    let tessReady = false;
    
    const questions = [
        "Did they meet your expectations?",
        "What was the best part about working with them?",
        "Would you recommend them to friends or family?"
    ];
    
    // ===== LOAD CONFIG =====
    async function loadConfig() {
        const { data } = await supabaseClient
            .from('clients')
            .select('metadata')
            .eq('client_id', clientId)
            .single();
        
        if (data?.metadata) {
            reviewConfig = data.metadata.modules?.reviewSystem || {};
        }
        
        if (reviewConfig.thankYouImage) {
            document.getElementById('splashBg').style.backgroundImage = `url(${reviewConfig.thankYouImage})`;
        }
        if (reviewConfig.logoUrl) {
            const logo = document.getElementById('logoOverlay');
            logo.src = reviewConfig.logoUrl;
            logo.style.display = 'block';
        }
        if (reviewConfig.tessSilentVideo) {
            const video = document.getElementById('silentTessVideo');
            video.src = reviewConfig.tessSilentVideo;
            video.style.display = 'block';
        }
        if (reviewConfig.companyName) {
            document.getElementById('splashSubtitle').textContent = `From all of us at ${reviewConfig.companyName}`;
            questions[0] = `Did ${reviewConfig.companyName} meet your expectations?`;
            questions[1] = `What was the best part about working with ${reviewConfig.companyName}?`;
            questions[2] = `Would you recommend ${reviewConfig.companyName} to friends or family?`;
        }
    }
    
    // ===== DAILY.CO + LEMONSLICE INTEGRATION =====
    async function initDailyRoom() {
        const agentId = reviewConfig.agentId;
        const apiKey = reviewConfig.lemonsliceApiKey || 'sk_lemon_Tleyq2zh6NoMpllEHf7mYNRxzIED6YcP';
        
        if (!agentId) {
            console.warn('No agent ID configured — running in demo mode');
            return;
        }
        
        try {
            const response = await fetch('https://lemonslice.com/api/liveai/rooms', {
                method: 'POST',
                headers: {
                    'X-API-Key': apiKey,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ agent_id: agentId })
            });
            
            const data = await response.json();
            
            if (data.room_url && data.token) {
                dailyCallObject = DailyIframe.createCallObject({ lang: 'en-us' });
                
                const container = document.createElement('div');
                container.id = 'daily-container';
                container.style.display = 'none';
                document.body.appendChild(container);
                
                if (dailyCallObject.iframe()) {
                    container.appendChild(dailyCallObject.iframe());
                }
                
                await dailyCallObject.join({ url: data.room_url, token: data.token });
                console.log('✅ Daily room joined');
                
                // Listen for Tess events
                dailyCallObject.on('app-message', (ev) => {
                    if (ev?.data?.type === 'bot_ready') {
                        tessReady = true;
                        console.log('✅ Tess is ready');
                        sendGreeting();
                    }
                    if (ev?.data?.type === 'agent_transcription') {
                        const text = ev.data.transcription;
                        console.log('🤖 Tess:', text);
                        handleTessTranscript(text);
                    }
                    if (ev?.data?.type === 'user_transcription') {
                        const text = ev.data.transcription;
                        console.log('👤 User:', text);
                        handleUserTranscript(text);
                    }
                });
            } else {
                console.warn('⚠️ Daily room creation returned no URL — demo mode');
            }
        } catch(e) {
            console.warn('⚠️ Daily init failed — running in demo mode:', e.message);
        }
    }
    
    function sendGreeting() {
        if (!dailyCallObject || !tessReady) return;
        const company = reviewConfig.companyName || 'our team';
        dailyCallObject.sendAppMessage({
            event: 'chat-msg',
            message: `Hi ${firstName}! We just wanted to reach out personally and thank you sincerely for your trust in ${company}. It truly means a lot to us. We're hoping you're 100% satisfied with your experience?`,
            name: 'Tess'
        }, '*');
    }
    
    function handleTessTranscript(text) {
        const lower = text.toLowerCase();
        // Detect when Tess asks for testimonial → trigger camera
        if (lower.includes('would you be willing') || lower.includes('share your experience')) {
            // User needs to respond, camera prompt comes after they say yes
        }
        if (lower.includes('are you ready') || lower.includes('camera will turn on')) {
            // Trigger camera permission
            setTimeout(() => startCameraFlow(), 2000);
        }
    }
    
    function handleUserTranscript(text) {
        const lower = text.toLowerCase();
        // Detect satisfaction responses
        if (lower.includes('yes') && (lower.includes('satisfied') || lower.includes('happy') || lower.includes('great'))) {
            // User is satisfied — Tess will handle the rest via KB
        }
        if (lower.includes('no') && (lower.includes('satisfied') || lower.includes('happy') || lower.includes('issues'))) {
            // User is not satisfied — Tess handles complaint via KB
        }
    }
    
    // ===== ACTIVATE TESS =====
    async function activateTess() {
        const btn = document.getElementById('btnListen');
        btn.textContent = '🎧 Connecting...';
        btn.disabled = true;
        
        // Show interview overlay
        document.getElementById('interviewOverlay').classList.add('active');
        document.getElementById('interviewContent').innerHTML = `
            <h2>Connecting to Tess...</h2>
            <p class="subtitle">Please wait a moment</p>
        `;
        
        // Initialize Daily room
        await initDailyRoom();
        
        // If Daily failed or no agent, show manual flow
        if (!dailyCallObject || !tessReady) {
            setTimeout(() => showManualSatisfactionCheck(), 3000);
        }
        // If Tess is active, she handles the conversation via KB
        // The interview overlay becomes the video recording interface
    }
    
    function showManualSatisfactionCheck() {
        document.getElementById('interviewContent').innerHTML = `
            <h2>Hi ${firstName}! 👋</h2>
            <p class="subtitle">We wanted to thank you sincerely for your trust. We're hoping you're 100% satisfied with your experience?</p>
            <button class="btn btn-green" onclick="handleSatisfaction(true)">😊 Yes, I'm very satisfied!</button>
            <button class="btn btn-red" onclick="handleSatisfaction(false)">😔 No, I had some issues</button>
        `;
    }
    
    function handleSatisfaction(satisfied) {
        if (!satisfied) {
            document.getElementById('interviewContent').innerHTML = `
                <div class="complaint-box">
                    <h2>😔 We're Sorry, ${firstName}</h2>
                    <p style="margin:12px 0;">We want to make this right. A representative will reach out to you shortly to address your concerns.</p>
                    <p style="color:rgba(255,255,255,0.5);font-size:0.85rem;">Your feedback has been forwarded to our team.</p>
                </div>
                <button class="btn btn-outline" onclick="closeInterview()" style="margin-top:12px;">Close</button>
            `;
            notifyClient('complaint', firstName);
            trackEvent('review_complaint');
            return;
        }
        
        document.getElementById('interviewContent').innerHTML = `
            <h2>That's Wonderful, ${firstName}! 🎉</h2>
            <p class="subtitle">Would you be willing to share your experience with other valued customers? We'd really appreciate it.</p>
            <button class="btn btn-gold" onclick="startCameraFlow()">🎤 Yes, I'd Love To!</button>
            <button class="btn btn-outline" onclick="showSimpleThanks()">🙏 No Thanks</button>
        `;
    }
    
    async function startCameraFlow() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        } catch(e) {
            stream = null;
        }
        currentQuestionIndex = 0;
        recordings = [];
        showRecordingStep();
    }
    
    function showRecordingStep() {
        if (currentQuestionIndex >= questions.length) {
            finishAllRecordings();
            return;
        }
        
        document.getElementById('interviewContent').innerHTML = `
            <h2><span class="recording-dot"></span>Recording</h2>
            <p class="subtitle">Q${currentQuestionIndex + 1}: ${questions[currentQuestionIndex]}</p>
            <div class="video-box">
                ${stream ? '<video id="previewVideo" autoplay muted playsinline></video>' : '<p style="color:rgba(255,255,255,0.5);">📷 Audio Only</p>'}
            </div>
            <div class="progress-row" id="progressRow"></div>
            <button class="btn btn-red" id="btnStop" onclick="stopRecording()">⏹ Stop Recording</button>
            <div class="accept-redo" id="acceptRedo" style="display:none;">
                <button class="btn btn-green" onclick="acceptRecording()">✅ Accept</button>
                <button class="btn btn-outline" onclick="redoRecording()">🔄 Redo</button>
            </div>
        `;
        
        updateProgress();
        if (stream) {
            const video = document.getElementById('previewVideo');
            if (video) { video.srcObject = stream; video.play(); }
        }
        startMediaRecording();
        
        // If Tess is connected, ask the question through Daily
        if (dailyCallObject && tessReady) {
            dailyCallObject.sendAppMessage({
                event: 'chat-msg',
                message: questions[currentQuestionIndex],
                name: 'Tess'
            }, '*');
        }
    }
    
    function updateProgress() {
        const row = document.getElementById('progressRow');
        if (!row) return;
        row.innerHTML = questions.map((_, i) => {
            let cls = 'pdot';
            if (i < currentQuestionIndex) cls += ' done';
            if (i === currentQuestionIndex) cls += ' current';
            return `<div class="${cls}"></div>`;
        }).join('');
    }
    
    function startMediaRecording() {
        recordedChunks = [];
        if (stream) {
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                recordings.push({
                    questionIndex: currentQuestionIndex,
                    question: questions[currentQuestionIndex],
                    blob: blob,
                    url: URL.createObjectURL(blob)
                });
                document.getElementById('btnStop').style.display = 'none';
                document.getElementById('acceptRedo').style.display = 'flex';
            };
            mediaRecorder.start();
        }
    }
    
    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
        }
    }
    
    function acceptRecording() {
        currentQuestionIndex++;
        showRecordingStep();
    }
    
    function redoRecording() {
        recordings.pop();
        showRecordingStep();
    }
    
    function finishAllRecordings() {
        if (dailyCallObject && tessReady) {
            dailyCallObject.sendAppMessage({
                event: 'chat-msg',
                message: `${firstName}, thank you so much for sharing that. Your words are going to help so many people. We're truly grateful for you!`,
                name: 'Tess'
            }, '*');
        }
        
        document.getElementById('interviewContent').innerHTML = `
            <div class="thank-icon">🎉</div>
            <h2>Thank You, ${firstName}!</h2>
            <p class="subtitle">Your testimonial means the world to us.</p>
            ${reviewConfig.incentive ? `<div class="incentive-box"><span>🎁</span> ${reviewConfig.incentive}</div>` : ''}
            <button class="btn btn-green" onclick="publishAll()" style="margin-top:16px;">✅ Publish My Testimonial</button>
        `;
        trackEvent('testimonial_completed', { videos: recordings.length });
    }
    
    function showSimpleThanks() {
        document.getElementById('interviewContent').innerHTML = `
            <div class="thank-icon">🙏</div>
            <h2>Thank You, ${firstName}!</h2>
            <p class="subtitle">We truly appreciate your trust in us.</p>
            <button class="btn btn-outline" onclick="closeInterview()">Close</button>
        `;
    }
    
    function closeInterview() {
        document.getElementById('interviewOverlay').classList.remove('active');
        if (dailyCallObject) {
            dailyCallObject.sendAppMessage({ event: 'force-end' }, '*');
            dailyCallObject.destroy();
        }
    }
    
    async function publishAll() {
        document.getElementById('interviewContent').innerHTML = `
            <div class="thank-icon">🚀</div>
            <h2>Published!</h2>
            <p class="subtitle">Your testimonial is being shared. Thank you!</p>
            <button class="btn btn-outline" onclick="closeInterview()">Close</button>
        `;
        trackEvent('testimonial_published', { videos: recordings.length });
        notifyClient('testimonial', firstName);
    }
    
    function notifyClient(type, name) {
        if (!reviewConfig.notifyEmail) return;
        emailjs.send("service_b9bppgb", "template_8kx812d", {
            to_email: reviewConfig.notifyEmail,
            full_name: name,
            email: reviewConfig.notifyEmail,
            phone: "",
            scheduled_datetime: new Date().toLocaleString(),
            message: type === 'complaint' 
                ? `⚠️ ${name} was NOT satisfied and needs follow-up.` 
                : `🎉 ${name} completed a testimonial! (${recordings.length} videos)`
        }).catch(() => {});
    }
    
    function trackEvent(eventType, eventData = {}) {
        fetch("https://fcgbusobfdwnpoqyuzoe.supabase.co/functions/v1/analytics-ingest", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY },
            body: JSON.stringify({
                client_id: clientId,
                session_id: 'review-' + Date.now(),
                event_type: eventType,
                event_data: eventData,
                source_url: window.location.href,
                referrer: document.referrer || 'direct',
                timestamp: Date.now()
            })
        }).catch(() => {});
    }
    
    loadConfig();
</script>
</body>
</html>
