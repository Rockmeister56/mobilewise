<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #050a12;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Full-screen thank you image */
        .hero-image {
            width: 100%;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px 20px;
        }
        .hero-image::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.35);
        }
        
        .overlay-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        
        .logo-overlay {
            height: 50px;
            margin-bottom: 20px;
        }
        
        .avatar-container {
            width: 180px; height: 260px;
            margin: 0 auto 20px;
            border-radius: 16px; overflow: hidden;
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .avatar-container lemon-slice-widget {
            width: 240px !important;
            height: 310px !important;
            margin: -15px 0 0 -30px;
        }
        
        .btn-listen {
            display: inline-block;
            padding: 16px 40px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            background: linear-gradient(135deg, #f8c400, #e6a800);
            color: #0a0f1e;
            box-shadow: 0 8px 30px rgba(248,196,0,0.3);
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn-listen:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(248,196,0,0.5);
        }
        
        /* Interview steps */
        .step-container {
            display: none;
            min-height: 100vh;
            background: #050a12;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .step-container.active {
            display: flex;
        }
        
        .card {
            background: rgba(18,28,46,0.95);
            border-radius: 20px;
            padding: 40px 30px;
            border: 1px solid rgba(255,255,255,0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .card h2 { font-size: 1.5rem; margin-bottom: 16px; }
        .card .subtitle { color: rgba(255,255,255,0.6); font-size: 0.95rem; margin-bottom: 24px; }
        
        .btn {
            display: inline-block;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            margin: 8px;
        }
        .btn-gold { background: #f8c400; color: #0a0f1e; }
        .btn-green { background: #00c853; color: #0a0f1e; }
        .btn-red { background: #f44336; color: white; }
        .btn-outline { background: transparent; border: 2px solid rgba(255,255,255,0.3); color: white; }
        .btn-gold:hover, .btn-green:hover { transform: translateY(-2px); }
        
        .recording-dot {
            display: inline-block; width: 12px; height: 12px;
            background: #f44336; border-radius: 50%;
            animation: pulse 1s infinite; margin-right: 8px;
        }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
        
        .video-box {
            width: 100%; border-radius: 12px; overflow: hidden;
            background: #000; aspect-ratio: 16/9; margin-bottom: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
        }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        
        .accept-redo { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
        
        .thank-icon { font-size: 4rem; margin-bottom: 16px; }
        .incentive-box {
            background: rgba(255,152,0,0.1);
            border: 1px solid rgba(255,152,0,0.3);
            border-radius: 12px; padding: 16px; margin-top: 16px;
        }
        
        .complaint-box {
            background: rgba(244,67,54,0.1);
            border: 1px solid rgba(244,67,54,0.3);
            border-radius: 12px; padding: 20px; margin-top: 16px;
            text-align: center;
        }
        
        .progress-row {
            display: flex; justify-content: center; gap: 6px; margin: 12px 0;
        }
        .pdot {
            width: 8px; height: 8px; border-radius: 50%;
            background: rgba(255,255,255,0.2);
        }
        .pdot.done { background: #00c853; }
        .pdot.current { background: #f8c400; animation: pulse 1s infinite; }
        
        .powered-by { color: rgba(255,255,255,0.25); font-size: 0.7rem; margin-top: 20px; }
    </style>
</head>
<body>

<!-- ===== HERO: THANK YOU IMAGE ===== -->
<div class="hero-image" id="heroSection" style="background-image: url('');">
    <div class="overlay-content">
        <img id="logoOverlay" class="logo-overlay" src="" alt="Logo" style="display:none;">
        <div class="avatar-container" id="avatarContainer"></div>
        <button class="btn-listen" id="btnListen" onclick="activateTess()">🎧 Listen to Your Personal Thank You Message</button>
    </div>
    <p class="powered-by" style="position:relative;z-index:1;">Powered by MobileWise AI</p>
</div>

<!-- ===== INTERVIEW STEPS ===== -->
<div class="step-container" id="stepInterview">
    <div class="card">
        <div id="interviewContent"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const clientId = urlParams.get('clientId') || 'demo';
    const firstName = urlParams.get('name') || 'Valued Customer';
    
    const SUPABASE_URL = "https://fcgbusobfdwnpoqyuzoe.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjZ2J1c29iZmR3bnBvcXl1em9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzNDA2MjMsImV4cCI6MjA4NTkxNjYyM30.FHEZnxuGHSn_Z3gw9d_Txtfz5Jn55J6qonl8rnA3gPk";
    
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    emailjs.init("7-9oxa3UC3uKxtqGM");
    
    let reviewConfig = {};
    let currentQuestionIndex = 0;
    let recordings = [];
    let mediaRecorder = null;
    let recordedChunks = [];
    let stream = null;
    
    const questions = [
        "Did ABC Mortgage meet your expectations?",
        "What was the best part about working with them?",
        "Would you recommend them to friends or family?"
    ];
    
    // ===== LOAD CONFIG =====
    async function loadConfig() {
        const { data } = await supabaseClient
            .from('clients')
            .select('metadata')
            .eq('client_id', clientId)
            .single();
        
        if (data?.metadata) {
            reviewConfig = data.metadata.modules?.reviewSystem || {};
        }
        
        // Apply thank you image
        if (reviewConfig.thankYouImage) {
            document.getElementById('heroSection').style.backgroundImage = `url(${reviewConfig.thankYouImage})`;
        }
        if (reviewConfig.logoUrl) {
            const logo = document.getElementById('logoOverlay');
            logo.src = reviewConfig.logoUrl;
            logo.style.display = 'block';
        }
        // Customize questions with company name
        if (reviewConfig.companyName) {
            questions[0] = `Did ${reviewConfig.companyName} meet your expectations?`;
            questions[1] = `What was the best part about working with ${reviewConfig.companyName}?`;
            questions[2] = `Would you recommend ${reviewConfig.companyName} to friends or family?`;
        }
    }
    
    // ===== ACTIVATE TESS (audio consent) =====
    function activateTess() {
        document.getElementById('btnListen').textContent = '🎧 Connecting...';
        document.getElementById('btnListen').disabled = true;
        
        // Simulate Tess activation — in production, this loads LemonSlice widget
        setTimeout(() => {
            showSatisfactionCheck();
        }, 1500);
    }
    
    function showSatisfactionCheck() {
        document.getElementById('heroSection').style.display = 'none';
        document.getElementById('stepInterview').classList.add('active');
        
        document.getElementById('interviewContent').innerHTML = `
            <div class="avatar-container" id="interviewAvatar" style="margin:0 auto 20px;"></div>
            <h2>Hi ${firstName}!</h2>
            <p class="subtitle">We wanted to thank you sincerely for your trust. We're hoping you're 100% satisfied with your experience?</p>
            <button class="btn btn-green" onclick="handleSatisfaction(true)">😊 Yes, I'm very satisfied!</button>
            <button class="btn btn-red" onclick="handleSatisfaction(false)">😔 No, I had some issues</button>
        `;
    }
    
    function handleSatisfaction(satisfied) {
        if (!satisfied) {
            document.getElementById('interviewContent').innerHTML = `
                <div class="complaint-box">
                    <h2>😔 We're Sorry</h2>
                    <p style="margin:12px 0;">We want to make it right. A representative will reach out to you shortly.</p>
                    <p style="color:rgba(255,255,255,0.5);font-size:0.85rem;">Your feedback has been forwarded to our team.</p>
                </div>
            `;
            notifyClient('complaint', firstName);
            trackEvent('review_complaint');
            return;
        }
        
        // Satisfied — ask for testimonial
        document.getElementById('interviewContent').innerHTML = `
            <h2>That's Wonderful! 🎉</h2>
            <p class="subtitle">Would you be willing to share your experience with other valued customers? We'd really appreciate it.</p>
            <button class="btn btn-gold" onclick="startCameraFlow()">🎤 Yes, I'd love to!</button>
            <button class="btn btn-outline" onclick="showThankYou()">🙏 No thanks, just the thank you</button>
        `;
    }
    
    async function startCameraFlow() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        } catch(e) {
            stream = null;
        }
        
        currentQuestionIndex = 0;
        recordings = [];
        showRecordingStep();
    }
    
    function showRecordingStep() {
        if (currentQuestionIndex >= questions.length) {
            finishAllRecordings();
            return;
        }
        
        document.getElementById('interviewContent').innerHTML = `
            <h2><span class="recording-dot"></span>Recording</h2>
            <p class="subtitle">Q${currentQuestionIndex + 1}: ${questions[currentQuestionIndex]}</p>
            <div class="video-box" id="videoBox">
                ${stream ? '<video id="previewVideo" autoplay muted playsinline></video>' : '<p style="color:rgba(255,255,255,0.5);">📷 Audio Only</p>'}
            </div>
            <div class="progress-row" id="progressRow"></div>
            <button class="btn btn-red" id="btnStop" onclick="stopRecording()">⏹ Stop Recording</button>
            <div class="accept-redo" id="acceptRedo" style="display:none;">
                <button class="btn btn-green" onclick="acceptRecording()">✅ Accept</button>
                <button class="btn btn-outline" onclick="redoRecording()">🔄 Redo</button>
            </div>
        `;
        
        updateProgress();
        
        if (stream) {
            const video = document.getElementById('previewVideo');
            if (video) { video.srcObject = stream; video.play(); }
        }
        
        startMediaRecording();
    }
    
    function updateProgress() {
        const row = document.getElementById('progressRow');
        if (!row) return;
        row.innerHTML = questions.map((_, i) => {
            let cls = 'pdot';
            if (i < currentQuestionIndex) cls += ' done';
            if (i === currentQuestionIndex) cls += ' current';
            return `<div class="${cls}"></div>`;
        }).join('');
    }
    
    function startMediaRecording() {
        recordedChunks = [];
        if (stream) {
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                recordings.push({
                    questionIndex: currentQuestionIndex,
                    question: questions[currentQuestionIndex],
                    blob: blob,
                    url: URL.createObjectURL(blob)
                });
                document.getElementById('btnStop').style.display = 'none';
                document.getElementById('acceptRedo').style.display = 'flex';
            };
            mediaRecorder.start();
        }
    }
    
    function stopRecording() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
            mediaRecorder.stop();
        }
    }
    
    function acceptRecording() {
        currentQuestionIndex++;
        showRecordingStep();
    }
    
    function redoRecording() {
        recordings.pop();
        showRecordingStep();
    }
    
    function finishAllRecordings() {
        document.getElementById('interviewContent').innerHTML = `
            <div class="thank-icon">🎉</div>
            <h2>Thank You, ${firstName}!</h2>
            <p class="subtitle">Your testimonial means the world to us.</p>
            ${reviewConfig.incentive ? `<div class="incentive-box"><span>🎁</span> ${reviewConfig.incentive}</div>` : ''}
            <button class="btn btn-green" onclick="publishAll()" style="margin-top:16px;">✅ Publish My Testimonial</button>
        `;
        trackEvent('testimonial_completed', { videos: recordings.length });
    }
    
    function showThankYou() {
        document.getElementById('interviewContent').innerHTML = `
            <div class="thank-icon">🙏</div>
            <h2>Thank You, ${firstName}!</h2>
            <p class="subtitle">We truly appreciate your trust in us.</p>
            <p style="color:rgba(255,255,255,0.4);font-size:0.85rem;">Have a wonderful day!</p>
        `;
    }
    
    async function publishAll() {
        document.getElementById('interviewContent').innerHTML = `
            <div class="thank-icon">🚀</div>
            <h2>Published!</h2>
            <p class="subtitle">Your testimonial is being shared. Thank you!</p>
        `;
        
        trackEvent('testimonial_published', { videos: recordings.length });
        notifyClient('testimonial', firstName);
    }
    
    function notifyClient(type, name) {
        if (!reviewConfig.notifyEmail) return;
        emailjs.send("service_b9bppgb", "template_8kx812d", {
            to_email: reviewConfig.notifyEmail,
            full_name: name,
            email: reviewConfig.notifyEmail,
            phone: "",
            scheduled_datetime: new Date().toLocaleString(),
            message: type === 'complaint' ? `⚠️ ${name} was NOT satisfied and needs follow-up.` : `🎉 ${name} completed a testimonial! (${recordings.length} videos)`
        }).catch(() => {});
    }
    
    function trackEvent(eventType, eventData = {}) {
        fetch("https://fcgbusobfdwnpoqyuzoe.supabase.co/functions/v1/analytics-ingest", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY },
            body: JSON.stringify({
                client_id: clientId,
                session_id: 'review-' + Date.now(),
                event_type: eventType,
                event_data: eventData,
                source_url: window.location.href,
                referrer: document.referrer || 'direct',
                timestamp: Date.now()
            })
        }).catch(() => {});
    }
    
    loadConfig();
</script>
</body>
</html>
