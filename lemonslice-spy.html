<!DOCTYPE html>
<html>
<head>
    <title>LemonSlice Web Component Audio Spy</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 900px; margin: auto; }
        #log { border: 2px solid #3498db; padding: 15px; margin-top: 20px; background: #f0f8ff; min-height: 300px; border-radius: 5px; }
        .log-entry { margin: 8px 0; padding: 5px; border-left: 4px solid #3498db; background: white; }
        .success { border-left-color: #2ecc71; background: #f0fff4; }
        .error { border-left-color: #e74c3c; background: #fff0f0; }
        .warning { border-left-color: #f39c12; background: #fff9e6; }
        .info { border-left-color: #3498db; }
        button { background: #3498db; color: white; border: none; padding: 10px 20px; margin: 5px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <h1>🔍 LemonSlice Web Component Audio Spy</h1>
    <p><strong>Goal:</strong> Find the audio source inside the &lt;lemon-slice-widget&gt; component.</p>

    <hr>
    <h3>Step 1: Load the Widget</h3>
    <!-- PASTE THE WIDGET TAG HERE -->
    <lemon-slice-widget agent-id="agent_1db77d60ec132469"></lemon-slice-widget>
    <!-- The script is loaded at the BOTTOM of the body for better control -->

    <hr>
    <h3>Step 2: Investigate</h3>
    <p>Wait for the widget to load (you should see the avatar interface), then click the buttons in sequence.</p>
    
    <button onclick="inspectComponent()">1. Inspect Web Component</button>
    <button onclick="huntForAudio()">2. Hunt for Audio Elements</button>
    <button onclick="monitorNetwork()">3. Monitor Network for Audio Streams</button>
    <button onclick="testGlobalObject()">4. Check for Global LemonSlice Object</button>

    <div id="log"></div>

    <!-- SCRIPT AT THE BOTTOM TO ENSURE DOM IS READY -->
    <script type="module">
        // Import the widget module. This is the PROPER way to load it when we control the page.
        import 'https://unpkg.com/@lemonsliceai/lemon-slice-widget';
        log('Widget module script loaded.', 'info');
    </script>

    <script>
        // Logging function
        const log = (msg, type = 'info') => {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            document.getElementById('log').appendChild(entry);
            console.log(`[${type.toUpperCase()}] ${msg}`);
        };

        // 1. INSPECT THE WEB COMPONENT ITSELF
        function inspectComponent() {
            log('--- Inspecting Web Component ---', 'info');
            const widget = document.querySelector('lemon-slice-widget');
            
            if (!widget) {
                log('ERROR: <lemon-slice-widget> element not found!', 'error');
                return;
            }
            log(`Found component with agent-id: ${widget.getAttribute('agent-id')}`, 'success');
            
            // Check if it has a Shadow Root (the key to encapsulation)
            if (widget.shadowRoot) {
                log('Component HAS a Shadow Root (encapsulated DOM).', 'warning');
                log('This makes accessing internal audio harder. We will try to traverse it.', 'info');
                traverseShadowDOM(widget.shadowRoot);
            } else {
                log('Component does NOT have a Shadow Root. Internal elements are directly accessible.', 'success');
            }
        }

        // Helper to look inside Shadow DOM
        function traverseShadowDOM(root, depth = 0) {
            const indent = '  '.repeat(depth);
            // Look for ALL audio elements inside this shadow root
            const audioElements = root.querySelectorAll('audio');
            if (audioElements.length > 0) {
                log(`${indent}🎉 Found ${audioElements.length} <audio> element(s) inside Shadow DOM!`, 'success');
                audioElements.forEach((audio, i) => {
                    log(`${indent}  Audio #${i}: src="${audio.src}"`, 'info');
                    // Save the first one we find for potential use
                    if (!window.lemonsliceAudioElement) {
                        window.lemonsliceAudioElement = audio;
                        log(`${indent}  -> Saved as window.lemonsliceAudioElement`, 'success');
                    }
                });
            }
            
            // Recursively traverse any nested shadow roots
            root.querySelectorAll('*').forEach(element => {
                if (element.shadowRoot) {
                    log(`${indent}Found nested Shadow Root in <${element.tagName.toLowerCase()}>, traversing...`, 'info');
                    traverseShadowDOM(element.shadowRoot, depth + 1);
                }
            });
        }

        // 2. TRADITIONAL HUNT FOR AUDIO ELEMENTS (may not find them in Shadow DOM)
        function huntForAudio() {
            log('--- Hunting for ALL audio elements on page ---', 'info');
            const allAudio = document.querySelectorAll('audio');
            log(`Found ${allAudio.length} total <audio> element(s) in main DOM.`, allAudio.length > 0 ? 'success' : 'warning');
            
            allAudio.forEach((audio, i) => {
                log(`Audio ${i}: src="${audio.src || 'No src'}", currentSrc="${audio.currentSrc}"`, 'info');
            });
        }

        // 3. LISTEN FOR NETWORK REQUESTS (to find audio stream URLs)
        function monitorNetwork() {
            log('--- Monitoring for media network requests ---', 'info');
            // This will only catch FUTURE network requests after clicking
            const originalFetch = window.fetch;
            window.fetch = function(...args) {
                const url = args[0];
                if (typeof url === 'string' && (url.includes('.m3u8') || url.includes('.mp3') || url.includes('.wav') || url.includes('audio'))) {
                    log(`Fetch intercepted for likely audio stream: ${url}`, 'warning');
                }
                return originalFetch.apply(this, args);
            };
            log('Fetch interceptor installed. Now trigger the avatar to speak.', 'info');
        }

        // 4. CHECK FOR A GLOBAL LEMONSLICE JAVASCRIPT OBJECT
        function testGlobalObject() {
            log('--- Checking for global LemonSlice API object ---', 'info');
            // Common pattern: widget exposes a global object like `LsAgent`, `LemonSlice`, etc.
            const possibleNames = ['LsAgent', 'LemonSlice', 'lemonSlice', 'lsWidget', 'widgetAgent'];
            let found = false;
            
            possibleNames.forEach(name => {
                if (window[name]) {
                    log(`Found global object: window.${name}`, 'success');
                    console.log(`Details of window.${name}:`, window[name]);
                    found = true;
                }
            });
            
            if (!found) {
                log('No obvious global LemonSlice API object found.', 'warning');
            }
        }

        // Auto-run basic inspection after a delay to let widget load
        setTimeout(() => {
            log('Page loaded. Starting initial inspection...', 'info');
            inspectComponent();
        }, 3000);
    </script>
</body>
</html>
