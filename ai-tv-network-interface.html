<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TV Network LIVE - Expert AI Commentary</title>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== TV NETWORK BACKGROUND ===== */
        .broadcast-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/form-assets/Backgrounds/aitvnetwork_wide.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -1;
        }

        /* ===== LIVE BROADCAST HEADER ===== */
        .broadcast-header {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            z-index: 100;
        }

        .network-branding {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .network-title {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(0, 212, 255, 0.3);
        }

        .live-indicator {
            background: #ff0000;
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .broadcast-time {
            font-size: 18px;
            opacity: 0.9;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        /* ===== LEMONSLICE AVATAR CONTAINER ===== */
        .avatar-stage {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 500px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            border: 3px solid rgba(0, 212, 255, 0.4);
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
        }

        #lemonslice-iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 17px;
        }

        /* ===== CONTROL PANEL OVERLAY ===== */
        .control-panel {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 380px;
            background: rgba(10, 10, 30, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-title {
            font-size: 18px;
            font-weight: bold;
            color: #00d4ff;
        }

        .panel-minimize {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .panel-minimize:hover {
            opacity: 1;
        }

        /* ===== CONTROL BUTTONS ===== */
        .control-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .control-btn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .control-btn.primary {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: white;
        }

        .control-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        /* ===== QUICK TOPICS ===== */
        .quick-topics {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 16px;
            margin-bottom: 12px;
            color: #00d4ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .topic-btn {
            padding: 12px;
            background: rgba(30, 58, 138, 0.5);
            border: 1px solid rgba(30, 58, 138, 0.7);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .topic-btn:hover {
            background: #1e3a8a;
            transform: scale(1.05);
        }

        /* ===== YOUR SYSTEMS ===== */
        .your-systems {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .system-buttons {
            display: grid;
            gap: 10px;
        }

        .system-btn {
            padding: 12px;
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
        }

        .system-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 1200px) {
            .avatar-stage {
                width: 600px;
                height: 400px;
            }
        }

        @media (max-width: 768px) {
            .broadcast-background {
                background-image: url('https://odetjszursuaxpapfwcy.supabase.co/storage/v1/object/public/form-assets/Backgrounds/aitvnetwork_mobile.png');
            }
            
            .broadcast-header {
                padding: 0 15px;
                top: 10px;
            }
            
            .network-title {
                font-size: 20px;
            }
            
            .avatar-stage {
                width: 90%;
                height: 300px;
                top: 40%;
            }
            
            .control-panel {
                width: 90%;
                right: 5%;
                bottom: 15px;
                padding: 15px;
            }
            
            .control-buttons {
                grid-template-columns: 1fr;
            }
            
            .topic-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-aspect-ratio: 9/16) {
            /* Mobile portrait */
            .avatar-stage {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <!-- 🎬 TV NETWORK BACKGROUND -->
    <div class="broadcast-background"></div>
    
    <!-- 📡 LIVE BROADCAST HEADER -->
    <div class="broadcast-header">
        <div class="network-branding">
            <div class="network-title">AI TV NETWORK</div>
            <div class="live-indicator">
                <span class="live-dot"></span>
                LIVE
            </div>
        </div>
        <div class="broadcast-time" id="broadcastTime">00:00:00</div>
    </div>
    
    <!-- 🍋 LEMONSLICE AVATAR STAGE -->
    <div class="avatar-stage">
        <iframe 
            id="lemonslice-iframe"
            src=""
            allow="microphone; camera; autoplay"
            allowfullscreen>
        </iframe>
    </div>
    
    <!-- 🎮 CONTROL PANEL OVERLAY -->
    <div class="control-panel" id="controlPanel">
        <div class="panel-header">
            <div class="panel-title">🎮 SHOW CONTROLS</div>
            <button class="panel-minimize" id="minimizeBtn">−</button>
        </div>
        
        <!-- Basic Controls -->
        <div class="control-buttons">
            <button class="control-btn primary" id="startBtn">
                🎤 Start Listening
            </button>
            <button class="control-btn secondary" id="pauseBtn">
                ⏸️ Pause
            </button>
            <button class="control-btn secondary" id="introBtn">
                🔊 Play Intro
            </button>
            <button class="control-btn secondary" id="statsBtn">
                📊 Show Stats
            </button>
        </div>
        
        <!-- Quick Topics -->
        <div class="quick-topics">
            <div class="section-title">🚀 QUICK TOPICS</div>
            <div class="topic-grid">
                <button class="topic-btn" data-topic="ai-ethics">
                    🤖 AI Ethics
                </button>
                <button class="topic-btn" data-topic="future">
                    🚀 Future Trends
                </button>
                <button class="topic-btn" data-topic="roi">
                    💰 Business ROI
                </button>
                <button class="topic-btn" data-topic="implementation">
                    🛠️ Implementation
                </button>
            </div>
        </div>
        
        <!-- Your Systems -->
        <div class="your-systems">
            <div class="section-title">📚 YOUR SYSTEMS</div>
            <div class="system-buttons">
                <button class="system-btn" id="showTestimonialBtn">
                    📺 Show Testimonial
                </button>
                <button class="system-btn" id="relayCenterBtn">
                    📞 Communication Relay
                </button>
                <button class="system-btn" id="caseStudyBtn">
                    📊 Case Study
                </button>
            </div>
        </div>
    </div>
    
    <!-- 📡 LemonSlice API Integration -->
    <script>
        // ===== CONFIGURATION =====
        const LEMONSLICE_API_KEY = 'YOUR_API_KEY_HERE'; // Get from LemonSlice
        const LEMONSLICE_AGENT_ID = 'YOUR_AGENT_ID'; // Your configured agent
        
        // ===== STATE =====
        let currentRoom = null;
        let isListening = false;
        let broadcastTimer = null;
        
        // ===== DOM ELEMENTS =====
        const lemonsliceIframe = document.getElementById('lemonslice-iframe');
        const broadcastTime = document.getElementById('broadcastTime');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const introBtn = document.getElementById('introBtn');
        const statsBtn = document.getElementById('statsBtn');
        const showTestimonialBtn = document.getElementById('showTestimonialBtn');
        const relayCenterBtn = document.getElementById('relayCenterBtn');
        const caseStudyBtn = document.getElementById('caseStudyBtn');
        const topicButtons = document.querySelectorAll('.topic-btn');
        const minimizeBtn = document.getElementById('minimizeBtn');
        const controlPanel = document.getElementById('controlPanel');
        
        // ===== BROADCAST TIMER =====
        function updateBroadcastTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            broadcastTime.textContent = `${hours}:${minutes}:${seconds}`;
        }
        
        // ===== LEMONSLICE INTEGRATION =====
        async function createDailyRoom() {
            try {
                console.log('🎬 Creating LemonSlice daily room...');
                
                // In production, use actual API call
                // const response = await fetch('https://lemonslice.com/api/rooms', {
                //     method: 'POST',
                //     headers: {
                //         'X-API-Key': LEMONSLICE_API_KEY,
                //         'Content-Type': 'application/json'
                //     },
                //     body: JSON.stringify({
                //         agent_id: LEMONSLICE_AGENT_ID,
                //         settings: {
                //             language: 'en-US',
                //             voice: 'nova',
                //             avatar: 'ava'
                //         }
                //     })
                // });
                
                // For demo, simulate response
                const mockRoomId = 'demo-room-' + Date.now();
                currentRoom = { id: mockRoomId };
                
                // Set iframe source
                lemonsliceIframe.src = `https://lemonslice.com/embed/${mockRoomId}`;
                
                console.log('✅ LemonSlice room created:', mockRoomId);
                return mockRoomId;
                
            } catch (error) {
                console.error('❌ Failed to create LemonSlice room:', error);
                return null;
            }
        }
        
        async function triggerResponse(text, emotion = 'neutral') {
            if (!currentRoom) return;
            
            console.log('🎙️ Triggering response:', text.substring(0, 50) + '...');
            
            // In production, use actual API
            // await fetch(`https://lemonslice.com/api/rooms/${currentRoom.id}/speak`, {
            //     method: 'POST',
            //     headers: {
            //         'X-API-Key': LEMONSLICE_API_KEY,
            //         'Content-Type': 'application/json'
            //     },
            //     body: JSON.stringify({
            //         text: text,
            //         emotion: emotion
            //     })
            // });
            
            // For demo, just log
            console.log('📢 Avatar would say:', text);
        }
        
        // ===== CONTROL FUNCTIONS =====
        async function startListening() {
            if (!currentRoom) {
                await createDailyRoom();
            }
            
            isListening = true;
            startBtn.innerHTML = '🎤 Listening...';
            startBtn.style.background = 'linear-gradient(135deg, #ff0000, #cc0000)';
            
            console.log('🎤 Started listening mode');
            
            // Trigger LemonSlice to start listening
            await triggerResponse("I'm listening for your questions about AI...");
        }
        
        function pauseListening() {
            isListening = false;
            startBtn.innerHTML = '🎤 Start Listening';
            startBtn.style.background = '';
            
            console.log('⏸️ Paused listening');
        }
        
        // ===== YOUR SYSTEMS INTEGRATION =====
        function showTestimonial() {
            console.log('📺 Triggering testimonial system');
            
            // Use your existing testimonial system
            if (window.showUniversalBanner) {
                window.showUniversalBanner('testimonialSelector');
            }
            
            // Trigger avatar to introduce testimonial
            triggerResponse("Let me show you a case study from one of our clients...");
        }
        
        function openCommunicationRelay() {
            console.log('📞 Opening Communication Relay Center');
            
            // Use your existing system
            if (window.showUniversalBanner) {
                window.showUniversalBanner('commRelayCenter');
            }
            
            triggerResponse("Opening our Q&A center for detailed questions...");
        }
        
        function showCaseStudy() {
            console.log('📊 Showing case study');
            
            // Use your testimonial data
            if (window.testimonialData) {
                const studies = Object.values(window.testimonialData.testimonialGroups);
                if (studies.length > 0) {
                    const study = studies[0];
                    triggerResponse(`Let's discuss ${study.name}. ${study.description}`);
                }
            }
        }
        
        // ===== TOPIC BUTTONS =====
        const topicResponses = {
            'ai-ethics': "AI ethics is crucial for responsible implementation. The key considerations are...",
            'future': "Looking at AI trends over the next 5 years, we'll see...",
            'roi': "The ROI for AI implementation typically ranges from 300-500% for our clients...",
            'implementation': "Implementing AI successfully requires three key steps: assessment, integration, and optimization..."
        };
        
        // ===== EVENT LISTENERS =====
        startBtn.addEventListener('click', startListening);
        pauseBtn.addEventListener('click', pauseListening);
        introBtn.addEventListener('click', () => triggerResponse("Welcome to AI TV Network Live! I'm your AI expert host...", 'excited'));
        statsBtn.addEventListener('click', () => console.log('📊 Stats requested'));
        
        showTestimonialBtn.addEventListener('click', showTestimonial);
        relayCenterBtn.addEventListener('click', openCommunicationRelay);
        caseStudyBtn.addEventListener('click', showCaseStudy);
        
        topicButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const topic = this.dataset.topic;
                const response = topicResponses[topic] || `Let's discuss ${topic.replace('-', ' ')}...`;
                triggerResponse(response);
            });
        });
        
        minimizeBtn.addEventListener('click', function() {
            const isMinimized = controlPanel.style.transform === 'translateX(100%)';
            if (isMinimized) {
                controlPanel.style.transform = 'translateX(0)';
                this.textContent = '−';
            } else {
                controlPanel.style.transform = 'translateX(100%)';
                this.textContent = '+';
            }
        });
        
        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('🎬 AI TV Network Initializing...');
            
            // Start broadcast timer
            updateBroadcastTime();
            broadcastTimer = setInterval(updateBroadcastTime, 1000);
            
            // Create initial LemonSlice room
            await createDailyRoom();
            
            console.log('✅ AI TV Network Ready for Broadcast!');
            
            // Auto-play intro after 3 seconds
            setTimeout(() => {
                triggerResponse("AI TV Network Live is now on air. Ready for your questions.", 'excited');
            }, 3000);
        });
        
        // ===== CLEANUP =====
        window.addEventListener('beforeunload', function() {
            if (broadcastTimer) clearInterval(broadcastTimer);
        });
    </script>
</body>
</html>
